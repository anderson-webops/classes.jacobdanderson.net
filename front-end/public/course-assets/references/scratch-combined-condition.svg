<svg xmlns="http://www.w3.org/2000/svg" width="480" height="650" viewBox="0 0 480 650" role="img" aria-labelledby="title description">
  <title id="title">Scratch nested branches for two touched colors</title>
  <desc id="description">An if then else tests touching blue AND touching white first. Its true branch says Both. Its else contains another if then else: touching blue says Blue; otherwise it says Not blue. Sensing supplies both color questions, Operators supplies and, Control supplies both if then else blocks, and Looks supplies say.</desc>
  <rect width="480" height="650" rx="12" fill="#f6f7fb"/>
  <g font-family="Arial, sans-serif" font-size="20" fill="#172235">
    <text x="20" y="34" font-weight="bold">Code tab: Control → if then else</text>
    <text x="20" y="66">Sensing → touching color? · Operators → and</text>
    <path d="M20 100 H460 V228 H44 V280 H460 V328 H44 V562 H460 V602 H20Z" fill="#ffab19" stroke="#bd7400" stroke-width="2"/>
    <text x="34" y="130">if</text>
    <path d="M82 142 H424 L444 178 L424 214 H82 L62 178Z" fill="#59c059" stroke="#348634" stroke-width="2"/>
    <path d="M98 151 H203 L216 167 L203 183 H98 L85 167Z" fill="#5cb1d6" stroke="#267c9f" stroke-width="2"/>
    <text x="101" y="174" font-size="17">blue?</text>
    <text x="231" y="185">and</text>
    <path d="M307 172 H412 L425 188 L412 204 H307 L294 188Z" fill="#5cb1d6" stroke="#267c9f" stroke-width="2"/>
    <text x="310" y="195" font-size="17">white?</text>
    <text x="382" y="132">then</text>
    <rect x="44" y="228" width="250" height="50" rx="5" fill="#9966ff" stroke="#6940b6" stroke-width="2"/>
    <text x="58" y="261" fill="#fff">say [Both]</text>
    <text x="34" y="312">else</text>
    <path d="M44 328 H442 V384 H68 V434 H442 V482 H68 V530 H442 V562 H44Z" fill="#ffab19" stroke="#bd7400" stroke-width="2"/>
    <text x="58" y="363">if</text>
    <path d="M112 336 H314 L334 355 L314 374 H112 L92 355Z" fill="#5cb1d6" stroke="#267c9f" stroke-width="2"/>
    <text x="112" y="363">touching blue?</text>
    <text x="350" y="363">then</text>
    <rect x="68" y="384" width="250" height="48" rx="5" fill="#9966ff" stroke="#6940b6" stroke-width="2"/>
    <text x="82" y="415" fill="#fff">say [Blue]</text>
    <text x="58" y="466">else</text>
    <rect x="68" y="482" width="280" height="48" rx="5" fill="#9966ff" stroke="#6940b6" stroke-width="2"/>
    <text x="82" y="513" fill="#fff">say [Not blue]</text>
    <text x="20" y="628" font-size="17">Blue? / white? = sampled touching color? blocks.</text>
  </g>
</svg>
