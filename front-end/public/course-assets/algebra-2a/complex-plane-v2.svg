<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1635" viewBox="0 0 720 1635" role="img" aria-labelledby="title description" fill="none"><title id="title">Complex numbers and geometry</title><desc id="description">Complex numbers are points with real and imaginary coordinates. The distance example joins two minus four i to seven plus three i. The right triangle has vertices minus three minus two i, five plus four i and five minus two i.</desc><rect width="720" height="1635" fill="white"/><g font-family="Arial, sans-serif"><text x="360" y="48" font-size="30" fill="#0f172a" text-anchor="middle">Complex numbers and geometry</text><g data-bounds="-5,5,-5,5" data-viewport="210,210,300,300"><text x="360" y="115" font-size="27" fill="#0f172a" text-anchor="middle">Plot a + bi at (a, b)</text><defs><clipPath id="plot-1"><rect x="210" y="210" width="300" height="300"/></clipPath></defs><line x1="240" y1="210" x2="240" y2="510" stroke="#cbd5e1" stroke-width="1.5"/><text x="240" y="537" font-size="20" fill="#475569" text-anchor="middle">-4</text><line x1="300" y1="210" x2="300" y2="510" stroke="#cbd5e1" stroke-width="1.5"/><text x="300" y="537" font-size="20" fill="#475569" text-anchor="middle">-2</text><line x1="360" y1="210" x2="360" y2="510" stroke="#cbd5e1" stroke-width="1.5"/><text x="360" y="537" font-size="20" fill="#475569" text-anchor="middle">0</text><line x1="420" y1="210" x2="420" y2="510" stroke="#cbd5e1" stroke-width="1.5"/><text x="420" y="537" font-size="20" fill="#475569" text-anchor="middle">2</text><line x1="480" y1="210" x2="480" y2="510" stroke="#cbd5e1" stroke-width="1.5"/><text x="480" y="537" font-size="20" fill="#475569" text-anchor="middle">4</text><line x1="210" y1="480" x2="510" y2="480" stroke="#cbd5e1" stroke-width="1.5"/><text x="198" y="487" font-size="20" fill="#475569" text-anchor="end">-4</text><line x1="210" y1="420" x2="510" y2="420" stroke="#cbd5e1" stroke-width="1.5"/><text x="198" y="427" font-size="20" fill="#475569" text-anchor="end">-2</text><line x1="210" y1="360" x2="510" y2="360" stroke="#cbd5e1" stroke-width="1.5"/><text x="198" y="367" font-size="20" fill="#475569" text-anchor="end">0</text><line x1="210" y1="300" x2="510" y2="300" stroke="#cbd5e1" stroke-width="1.5"/><text x="198" y="307" font-size="20" fill="#475569" text-anchor="end">2</text><line x1="210" y1="240" x2="510" y2="240" stroke="#cbd5e1" stroke-width="1.5"/><text x="198" y="247" font-size="20" fill="#475569" text-anchor="end">4</text><line x1="360" y1="210" x2="360" y2="510" stroke="#334155" stroke-width="1.5"/><line x1="210" y1="360" x2="510" y2="360" stroke="#334155" stroke-width="1.5"/><text x="525" y="367" font-size="21" fill="#0f172a" text-anchor="start">Re</text><text x="370" y="203" font-size="21" fill="#0f172a" text-anchor="start">Im</text><g clip-path="url(#plot-1)"><circle data-coordinate="3,2" cx="450" cy="300" r="6" fill="#0f172a" stroke="#0f172a" stroke-width="2.5"/><circle data-coordinate="-2,-4" cx="300" cy="480" r="6" fill="#0f172a" stroke="#0f172a" stroke-width="2.5"/><circle data-coordinate="2,-1" cx="420" cy="390" r="6" fill="#0f172a" stroke="#0f172a" stroke-width="2.5"/><circle data-coordinate="4,0" cx="480" cy="360" r="6" fill="#0f172a" stroke="#0f172a" stroke-width="2.5"/><circle data-coordinate="0,-3" cx="360" cy="450" r="6" fill="#0f172a" stroke="#0f172a" stroke-width="2.5"/><circle data-coordinate="1,4" cx="390" cy="240" r="6" fill="#0f172a" stroke="#0f172a" stroke-width="2.5"/></g><text x="460" y="288" font-size="20" fill="#0f172a" text-anchor="start">3 + 2i</text><text x="290" y="468" font-size="20" fill="#0f172a" text-anchor="end">−2 − 4i</text><text x="430" y="378" font-size="20" fill="#0f172a" text-anchor="start">2 − i</text><text x="490" y="348" font-size="20" fill="#0f172a" text-anchor="start">4</text><text x="370" y="472" font-size="20" fill="#0f172a" text-anchor="start">−3i</text><text x="400" y="228" font-size="20" fill="#0f172a" text-anchor="start">1 + 4i</text><text x="360" y="566" font-size="21" fill="#334155" text-anchor="middle">Real part = horizontal coordinate; imaginary part =</text><text x="360" y="591" font-size="21" fill="#334155" text-anchor="middle">vertical.</text></g><g data-bounds="0,10,-5,5" data-viewport="210,720,300,300"><text x="360" y="625" font-size="27" fill="#0f172a" text-anchor="middle">Distance on the complex plane</text><text x="80" y="658" font-size="21" fill="#2563eb" text-anchor="start">From 2 − 4i to 7 + 3i</text><defs><clipPath id="plot-2"><rect x="210" y="720" width="300" height="300"/></clipPath></defs><line x1="210" y1="720" x2="210" y2="1020" stroke="#cbd5e1" stroke-width="1.5"/><text x="210" y="1047" font-size="20" fill="#475569" text-anchor="middle">0</text><line x1="270" y1="720" x2="270" y2="1020" stroke="#cbd5e1" stroke-width="1.5"/><text x="270" y="1047" font-size="20" fill="#475569" text-anchor="middle">2</text><line x1="330" y1="720" x2="330" y2="1020" stroke="#cbd5e1" stroke-width="1.5"/><text x="330" y="1047" font-size="20" fill="#475569" text-anchor="middle">4</text><line x1="390" y1="720" x2="390" y2="1020" stroke="#cbd5e1" stroke-width="1.5"/><text x="390" y="1047" font-size="20" fill="#475569" text-anchor="middle">6</text><line x1="450" y1="720" x2="450" y2="1020" stroke="#cbd5e1" stroke-width="1.5"/><text x="450" y="1047" font-size="20" fill="#475569" text-anchor="middle">8</text><line x1="510" y1="720" x2="510" y2="1020" stroke="#cbd5e1" stroke-width="1.5"/><text x="510" y="1047" font-size="20" fill="#475569" text-anchor="middle">10</text><line x1="210" y1="990" x2="510" y2="990" stroke="#cbd5e1" stroke-width="1.5"/><text x="198" y="997" font-size="20" fill="#475569" text-anchor="end">-4</text><line x1="210" y1="930" x2="510" y2="930" stroke="#cbd5e1" stroke-width="1.5"/><text x="198" y="937" font-size="20" fill="#475569" text-anchor="end">-2</text><line x1="210" y1="870" x2="510" y2="870" stroke="#cbd5e1" stroke-width="1.5"/><text x="198" y="877" font-size="20" fill="#475569" text-anchor="e