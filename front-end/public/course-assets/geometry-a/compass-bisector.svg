<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" role="img" aria-labelledby="title desc">
  <title id="title">Perpendicular bisector from equal-radius circles</title>
  <desc id="desc">A is at minus three, zero and B at three, zero. Circles of radius five centered at A and B meet at P, zero, four, and Q, zero, minus four. Their common chord PQ passes through midpoint M, zero, zero, perpendicular to AB.</desc>
  <rect width="680" height="500" rx="16" fill="#fff"/>
  <g fill="none" stroke="#4e827c" stroke-width="2">
    <circle cx="220" cy="250" r="200" stroke-dasharray="7 5"/>
    <circle cx="460" cy="250" r="200" stroke-dasharray="7 5"/>
  </g>
  <g fill="none" stroke="#193146" stroke-width="3">
    <path d="M 220 250 H 460"/>
    <path d="M 340 35 V 465"/>
    <path d="M 340 232 H 358 V 250" stroke-width="2"/>
    <path d="M 220 250 L 340 90 L 460 250" stroke="#4e827c" stroke-width="2"/>
  </g>
  <g fill="#193146">
    <circle cx="220" cy="250" r="5"/><circle cx="460" cy="250" r="5"/>
    <circle cx="340" cy="90" r="5"/><circle cx="340" cy="410" r="5"/>
    <circle cx="340" cy="250" r="5"/>
  </g>
  <g fill="#193146" font-family="Arial, sans-serif" font-size="34">
    <text x="186" y="288">A</text><text x="474" y="288">B</text>
    <text x="358" y="90">P</text><text x="358" y="426">Q</text>
    <text x="302" y="290">M</text>
    <text x="196" y="151" font-size="30" fill="#365f5a">radius 5</text>
  </g>
</svg>
