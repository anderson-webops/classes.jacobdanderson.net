<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 310" role="img" aria-labelledby="title desc">
<title id="title">Light final angle and rotation</title><desc id="desc">A downward ray is perpendicular to a horizontal ceiling. A ray turned toward the left is 23 degrees below the ceiling and 67 degrees from the original ray.</desc>
<rect width="480" height="310" fill="white"/><g font-family="sans-serif" font-size="18" fill="#173b45">
<text x="240" y="26" text-anchor="middle" font-size="21">Light angle</text><line x1="30" y1="50" x2="450" y2="50" stroke="#173b45" stroke-width="3"/><text x="345" y="78">ceiling</text>
<line id="initial-ray" x1="240" y1="50" x2="240" y2="250" stroke="#64748b" stroke-width="4" stroke-dasharray="7 5"/>
<line id="final-ray" x1="240" y1="50" x2="65.104078" y2="124.238914" stroke="#007a69" stroke-width="4"/>
<path d="M220 50 V70 H240" fill="none" stroke="#64748b" stroke-width="2"/>
<path d="M180 50 A60 60 0 0 0 184.769709 73.443868" fill="none" stroke="#b25d18" stroke-width="2"/>
<path d="M240 140 A90 90 0 0 1 157.154563 85.165802" fill="none" stroke="#007a69" stroke-width="2"/>
<text x="49" y="88" fill="#8c4512">23° final</text><text x="143" y="169" fill="#006354">67° turn</text><text x="255" y="218" fill="#475569">90° start</text>
<text x="240" y="286" text-anchor="middle">90° = 67° + 23°</text></g></svg>
