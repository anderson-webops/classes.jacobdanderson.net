<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1125" viewBox="0 0 720 1125" role="img" aria-labelledby="title description" fill="none"><title id="title">Arithmetic sequences and sums</title><desc id="description">Sequence indices are positive integers with equal spacing. The first sequence begins with four at index one. The sum example totals ten through one hundred.</desc><rect width="720" height="1125" fill="white"/><g font-family="Arial, sans-serif"><text x="360" y="48" font-size="30" fill="#0f172a" text-anchor="middle">Arithmetic sequences and sums</text><g data-bounds="0,6,0,18" data-viewport="80,210,560,300"><text x="360" y="115" font-size="27" fill="#0f172a" text-anchor="middle">One term at a time</text><text x="80" y="148" font-size="21" fill="#2563eb" text-anchor="start">aₙ = 4 + 3(n − 1)</text><defs><clipPath id="plot-1"><rect x="80" y="210" width="560" height="300"/></clipPath></defs><line x1="80" y1="210" x2="80" y2="510" stroke="#cbd5e1" stroke-width="1.5"/><text x="80" y="537" font-size="20" fill="#475569" text-anchor="middle">0</text><line x1="173.3333" y1="210" x2="173.3333" y2="510" stroke="#cbd5e1" stroke-width="1.5"/><text x="173.3333" y="537" font-size="20" fill="#475569" text-anchor="middle">1</text><line x1="266.6667" y1="210" x2="266.6667" y2="510" stroke="#cbd5e1" stroke-width="1.5"/><text x="266.6667" y="537" font-size="20" fill="#475569" text-anchor="middle">2</text><line x1="360" y1="210" x2="360" y2="510" stroke="#cbd5e1" stroke-width="1.5"/><text x="360" y="537" font-size="20" fill="#475569" text-anchor="middle">3</text><line x1="453.3333" y1="210" x2="453.3333" y2="510" stroke="#cbd5e1" stroke-width="1.5"/><text x="453.3333" y="537" font-size="20" fill="#475569" text-anchor="middle">4</text><line x1="546.6667" y1="210" x2="546.6667" y2="510" stroke="#cbd5e1" stroke-width="1.5"/><text x="546.6667" y="537" font-size="20" fill="#475569" text-anchor="middle">5</text><line x1="640" y1="210" x2="640" y2="510" stroke="#cbd5e1" stroke-width="1.5"/><text x="640" y="537" font-size="20" fill="#475569" text-anchor="middle">6</text><line x1="80" y1="510" x2="640" y2="510" stroke="#cbd5e1" stroke-width="1.5"/><text x="68" y="517" font-size="20" fill="#475569" text-anchor="end">0</text><line x1="80" y1="443.3333" x2="640" y2="443.3333" stroke="#cbd5e1" stroke-width="1.5"/><text x="68" y="450.3333" font-size="20" fill="#475569" text-anchor="end">4</text><line x1="80" y1="376.6667" x2="640" y2="376.6667" stroke="#cbd5e1" stroke-width="1.5"/><text x="68" y="383.6667" font-size="20" fill="#475569" text-anchor="end">8</text><line x1="80" y1="310" x2="640" y2="310" stroke="#cbd5e1" stroke-width="1.5"/><text x="68" y="317" font-size="20" fill="#475569" text-anchor="end">12</text><line x1="80" y1="243.3333" x2="640" y2="243.3333" stroke="#cbd5e1" stroke-width="1.5"/><text x="68" y="250.3333" font-size="20" fill="#475569" text-anchor="end">16</text><line x1="80" y1="210" x2="80" y2="510" stroke="#334155" stroke-width="1.5"/><line x1="80" y1="510" x2="640" y2="510" stroke="#334155" stroke-width="1.5"/><text x="655" y="517" font-size="21" fill="#0f172a" text-anchor="start">n</text><text x="90" y="203" font-size="21" fill="#0f172a" text-anchor="start">aₙ</text><g clip-path="url(#plot-1)"><circle data-equation="arithmetic-terms" cx="173.3333" cy="443.3333" r="5" fill="#2563eb"/><circle data-equation="arithmetic-terms" cx="266.6667" cy="393.3333" r="5" fill="#2563eb"/><circle data-equation="arithmetic-terms" cx="360" cy="343.3333" r="5" fill="#2563eb"/><circle data-equation="arithmetic-terms" cx="453.3333" cy="293.3333" r="5" fill="#2563eb"/><circle data-equation="arithmetic-terms" cx="546.6667" cy="243.3333" r="5" fill="#2563eb"/></g><text x="360" y="566" font-size="21" fill="#334155" text-anchor="middle">The terms 4, 7, 10, 13, 16 have common difference 3.</text></g><g data-bounds="0,11,0,600" data-viewport="80,720,560,300"><text x="360" y="625" font-size="27" fill="#0f172a" text-anchor="middle">10 + 20 + … + 100</text><text x="80" y="658" font-size="21" fill="#2563eb" text-anchor="start">Sₙ = n(10 + 10n) / 2</text><defs><clipPath id="plot-2"><rect x="80" y="720" width="560" height="300"/></clipPath></defs><line x1="80" y1="720" x2="80" y2="1020" stroke="#cbd5e1" stroke-width="1.5"/><text x="80" y="1047" font-size="20" fill="#475569" text-anchor="middle">0</text><line x1="181.8182" y1="720" x2="181.8182" y2="1020" stroke="#cbd5e1" stroke-width="1.5"/><text x="181.8182" y="1047" font-size="20" fill="#475569" text-anchor="middle">2</text><line x1="283.6364" y1="720" x2="283.6364" y2="1020" stroke="#cbd5e1" stroke-width="1.5"/><text x="283.6364" y="1047" font-size="20" fill="#475569" text-anchor="middle">4</text><line x1="385.4545" y1="720" x2="385.4545" y2="1020" stroke="#cbd5e1" stroke-width="1.5"/><text x="385.4545" y="1047" font-size="20" fill="#475569" text-anchor="middle">6</text><line x1="487.2727" y1="720" x2="487.2727" y2="1020" stroke="#cbd5e1" stroke-width="1.5"/><text x="487.2727" y="1047" font-size="20" fill="#475569" text-anchor="middle">8</text><line x1="589.0909" y1="720" x2="589.0909" y2="1020" stroke="#cbd5e1" stroke-width="1.5"/><text x="589.0909" y="1047" font-size="20" fill="#475569" text-anchor="middle">10</text><line x1="80" y1="1020" x2="640" y2="1020" stroke="#cbd5e1" stroke-width="1.5"/><text x="68" y="1027" font-size="20" fill="#475569" text-anchor="end">0</text><line x1="80" y1="970" x2="640" y2="970" stroke="#cbd5e1" stroke-width="1.5"/><text x="68" y="977" font-size="20" fill="#475569" text-anchor="end">100</text><line x1="80" y1="920" x2="640" y2="920" stroke="#cbd5e1" stroke-width="1.5"/><text x="68" y="927" font-size="20" fill="#475569" text-anchor="end">200</text><line x1="80" y1="870" x2="640" y2="870" stroke="#cbd5e1" stroke-width="1.5"/><text x="68" y="877" font-size="20" fill="#475569" text-anchor="end">300</text><line x1="80" y1="820" x2="640" y2="820" stroke="#cbd5e1" stroke-width="1.5"/><text x="68" y="827" font-size="20" fill="#475569" text-anchor="end">400</text><line x1="80" y1="770" x2="640" y2="770" stroke="#cbd5e1" stroke-width="1.5"/><text x="68" y="777" font-size="20" fill="#475569" text-anchor="end">500</text><line x1="80" y1="720" x2="640" y2="720" stroke="#cbd5e1" stroke-width="1.5"/><text x="68" y="727" font-size="20" fill="#475569" text-anchor="end">600</text><line x1="80" y1="720" x2="80" y2="1020" stroke="#334155" stroke-width="1.5"/><line x1="80" y1="1020" x2="640" y2="1020" stroke="#334155" stroke-width="1.5"/><text x="655" y="1027" font-size="21" fill="#0f172a" text-anchor="start">n</text><text x="90" y="713" font-size="21" fill="#0f172a" text-anchor="start">Sₙ</text><g clip-path="url(#plot-2)"><circle data-equation="arithmetic-sums" cx="130.9091" cy="1015" r="5" fill="#2563eb"/><circle data-equation="arithmetic-sums" cx="181.8182" cy="1005" r="5" fill="#2563eb"/><circle data-equation="arithmetic-sums" cx="232.7273" cy="990" r="5" fill="#2563eb"/><circle data-equation="arithmetic-sums" cx="283.6364" cy="970" r="5" fill="#2563eb"/><circle data-equation="arithmetic-sums" cx="334.5455" cy="945" r="5" fill="#2563eb"/><circle data-equation="arithmetic-sums" cx="385.4545" cy="915" r="5" fill="#2563eb"/><circle data-equation="arithmetic-sums" cx="436.3636" cy="880" r="5" fill="#2563eb"/><circle data-equation="arithmetic-sums" cx="487.2727" cy="840" r="5" fill="#2563eb"/><circle data-equation="arithmetic-sums" cx="538.1818" cy="795" r="5" fill="#2563eb"/><circle data-equation="arithmetic-sums" cx="589.0909" cy="745" r="5" fill="#2563eb"/></g><text x="360" y="1076" font-size="21" fill="#334155" text-anchor="middle">Five first-and-last pairs of 110 give S₁₀ = 550.</text></g></g></svg>
