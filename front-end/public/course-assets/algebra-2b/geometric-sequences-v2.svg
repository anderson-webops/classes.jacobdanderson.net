<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1125" viewBox="0 0 720 1125" role="img" aria-labelledby="title description" fill="none"><title id="title">Geometric sequences and sums</title><desc id="description">The term index increases by one at each plotted point and each term is three times the previous term. The partial sums of successive halves approach one from below.</desc><rect width="720" height="1125" fill="white"/><g font-family="Arial, sans-serif"><text x="360" y="48" font-size="30" fill="#0f172a" text-anchor="middle">Geometric sequences and sums</text><g data-bounds="0,6,0,90" data-viewport="80,210,560,300"><text x="360" y="115" font-size="27" fill="#0f172a" text-anchor="middle">Repeated multiplication</text><text x="80" y="148" font-size="21" fill="#2563eb" text-anchor="start">aₙ = 3^(n − 1)</text><defs><clipPath id="plot-1"><rect x="80" y="210" width="560" height="300"/></clipPath></defs><line x1="80" y1="210" x2="80" y2="510" stroke="#cbd5e1" stroke-width="1.5"/><text x="80" y="537" font-size="20" fill="#475569" text-anchor="middle">0</text><line x1="173.3333" y1="210" x2="173.3333" y2="510" stroke="#cbd5e1" stroke-width="1.5"/><text x="173.3333" y="537" font-size="20" fill="#475569" text-anchor="middle">1</text><line x1="266.6667" y1="210" x2="266.6667" y2="510" stroke="#cbd5e1" stroke-width="1.5"/><text x="266.6667" y="537" font-size="20" fill="#475569" text-anchor="middle">2</text><line x1="360" y1="210" x2="360" y2="510" stroke="#cbd5e1" stroke-width="1.5"/><text x="360" y="537" font-size="20" fill="#475569" text-anchor="middle">3</text><line x1="453.3333" y1="210" x2="453.3333" y2="510" stroke="#cbd5e1" stroke-width="1.5"/><text x="453.3333" y="537" font-size="20" fill="#475569" text-anchor="middle">4</text><line x1="546.6667" y1="210" x2="546.6667" y2="510" stroke="#cbd5e1" stroke-width="1.5"/><text x="546.6667" y="537" font-size="20" fill="#475569" text-anchor="middle">5</text><line x1="640" y1="210" x2="640" y2="510" stroke="#cbd5e1" stroke-width="1.5"/><text x="640" y="537" font-size="20" fill="#475569" text-anchor="middle">6</text><line x1="80" y1="510" x2="640" y2="510" stroke="#cbd5e1" stroke-width="1.5"/><text x="68" y="517" font-size="20" fill="#475569" text-anchor="end">0</text><line x1="80" y1="443.3333" x2="640" y2="443.3333" stroke="#cbd5e1" stroke-width="1.5"/><text x="68" y="450.3333" font-size="20" fill="#475569" text-anchor="end">20</text><line x1="80" y1="376.6667" x2="640" y2="376.6667" stroke="#cbd5e1" stroke-width="1.5"/><text x="68" y="383.6667" font-size="20" fill="#475569" text-anchor="end">40</text><line x1="80" y1="310" x2="640" y2="310" stroke="#cbd5e1" stroke-width="1.5"/><text x="68" y="317" font-size="20" fill="#475569" text-anchor="end">60</text><line x1="80" y1="243.3333" x2="640" y2="243.3333" stroke="#cbd5e1" stroke-width="1.5"/><text x="68" y="250.3333" font-size="20" fill="#475569" text-anchor="end">80</text><line x1="80" y1="210" x2="80" y2="510" stroke="#334155" stroke-width="1.5"/><line x1="80" y1="510" x2="640" y2="510" stroke="#334155" stroke-width="1.5"/><text x="655" y="517" font-size="21" fill="#0f172a" text-anchor="start">n</text><text x="90" y="203" font-size="21" fill="#0f172a" text-anchor="start">aₙ</text><g clip-path="url(#plot-1)"><circle data-equation="geometric-terms" cx="173.3333" cy="506.6667" r="5" fill="#2563eb"/><circle data-equation="geometric-terms" cx="266.6667" cy="500" r="5" fill="#2563eb"/><circle data-equation="geometric-terms" cx="360" cy="480" r="5" fill="#2563eb"/><circle data-equation="geometric-terms" cx="453.3333" cy="420" r="5" fill="#2563eb"/><circle data-equation="geometric-terms" cx="546.6667" cy="240" r="5" fill="#2563eb"/></g><text x="360" y="566" font-size="21" fill="#334155" text-anchor="middle">The terms 1, 3, 9, 27, 81 have common ratio 3.</text></g><g data-bounds="0,9,0,1.1" data-viewport="80,720,560,300"><text x="360" y="625" font-size="27" fill="#0f172a" text-anchor="middle">1/2 + 1/4 + 1/8 + …</text><text x="80" y="658" font-size="21" fill="#2563eb" text-anchor="start">Sₙ = 1 − (1/2)ⁿ</text><defs><clipPath id="plot-2"><rect x="80" y="720" width="560" height="300"/></clipPath></defs><line x1="80" y1="720" x2="80" y2="1020" stroke="#cbd5e1" stroke-width="1.5"/><text x="80" y="1047" font-size="20" fill="#475569" text-anchor="middle">0</text><line x1="142.2222" y1="720" x2="142.2222" y2="1020" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2222" y="1047" font-size="20" fill="#475569" text-anchor="middle">1</text><line x1="204.4444" y1="720" x2="204.4444" y2="1020" stroke="#cbd5e1" stroke-width="1.5"/><text x="204.4444" y="1047" font-size="20" fill="#475569" text-anchor="middle">2</text><line x1="266.6667" y1="720" x2="266.6667" y2="1020" stroke="#cbd5e1" stroke-width="1.5"/><text x="266.6667" y="1047" font-size="20" fill="#475569" text-anchor="middle">3</text><line x1="328.8889" y1="720" x2="328.8889" y2="1020" stroke="#cbd5e1" stroke-width="1.5"/><text x="328.8889" y="1047" font-size="20" fill="#475569" text-anchor="middle">4</text><line x1="391.1111" y1="720" x2="391.1111" y2="1020" stroke="#cbd5e1" stroke-width="1.5"/><text x="391.1111" y="1047" font-size="20" fill="#475569" text-anchor="middle">5</text><line x1="453.3333" y1="720" x2="453.3333" y2="1020" stroke="#cbd5e1" stroke-width="1.5"/><text x="453.3333" y="1047" font-size="20" fill="#475569" text-anchor="middle">6</text><line x1="515.5556" y1="720" x2="515.5556" y2="1020" stroke="#cbd5e1" stroke-width="1.5"/><text x="515.5556" y="1047" font-size="20" fill="#475569" text-anchor="middle">7</text><line x1="577.7778" y1="720" x2="577.7778" y2="1020" stroke="#cbd5e1" stroke-width="1.5"/><text x="577.7778" y="1047" font-size="20" fill="#475569" text-anchor="middle">8</text><line x1="80" y1="1020" x2="640" y2="1020" stroke="#cbd5e1" stroke-width="1.5"/><text x="68" y="1027" font-size="20" fill="#475569" text-anchor="end">0</text><line x1="80" y1="883.6364" x2="640" y2="883.6364" stroke="#cbd5e1" stroke-width="1.5"/><text x="68" y="890.6364" font-size="20" fill="#475569" text-anchor="end">1/2</text><line x1="80" y1="747.2727" x2="640" y2="747.2727" stroke="#cbd5e1" stroke-width="1.5"/><text x="68" y="754.2727" font-size="20" fill="#475569" text-anchor="end">1</text><line x1="80" y1="720" x2="80" y2="1020" stroke="#334155" stroke-width="1.5"/><line x1="80" y1="1020" x2="640" y2="1020" stroke="#334155" stroke-width="1.5"/><text x="655" y="1027" font-size="21" fill="#0f172a" text-anchor="start">n</text><text x="90" y="713" font-size="21" fill="#0f172a" text-anchor="start">Sₙ</text><g clip-path="url(#plot-2)"><line x1="80" y1="747.2727" x2="640" y2="747.2727" stroke="#64748b" stroke-width="1.5" stroke-dasharray="8 6"/><circle data-equation="geometric-sums" cx="142.2222" cy="883.6364" r="5" fill="#2563eb"/><circle data-equation="geometric-sums" cx="204.4444" cy="815.4545" r="5" fill="#2563eb"/><circle data-equation="geometric-sums" cx="266.6667" cy="781.3636" r="5" fill="#2563eb"/><circle data-equation="geometric-sums" cx="328.8889" cy="764.3182" r="5" fill="#2563eb"/><circle data-equation="geometric-sums" cx="391.1111" cy="755.7955" r="5" fill="#2563eb"/><circle data-equation="geometric-sums" cx="453.3333" cy="751.5341" r="5" fill="#2563eb"/><circle data-equation="geometric-sums" cx="515.5556" cy="749.4034" r="5" fill="#2563eb"/><circle data-equation="geometric-sums" cx="577.7778" cy="748.3381" r="5" fill="#2563eb"/></g><text x="360" y="1076" font-size="21" fill="#334155" text-anchor="middle">Every finite sum is below 1; the infinite series has sum 1.</text></g></g></svg>
