[build]
publish = "front-end/dist"
command = "npm run build"

[build.environment]
NODE_VERSION = "24.18.0"

[[redirects]]
from = "/api/*"
to = "/api-unavailable"
status = 404
force = true

[[headers]]
for = "/*"

[headers.values]
Strict-Transport-Security = "max-age=31536000; includeSubDomains"
Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob: https:; font-src 'self' data: https:; style-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob: https:; connect-src 'self' https: wss: ws:; frame-src 'self' https:; media-src 'self' blob: https:; worker-src 'self' blob:; manifest-src 'self'"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), geolocation=(), microphone=()"
X-Frame-Options = "DENY"

[[headers]]
for = "/site.webmanifest"

[headers.values]
Content-Type = "application/manifest+json"
