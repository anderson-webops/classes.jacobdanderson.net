[build]
publish = "front-end/dist"
command = "npm run build"

[build.environment]
NODE_VERSION = "24.18.0"

[build.processing.html]
pretty_urls = true

[[redirects]]
from = "/api/*"
to = "/api-unavailable"
status = 404
force = true

[[headers]]
for = "/*"

[headers.values]
Strict-Transport-Security = "max-age=31536000; includeSubDomains"
Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https://static.classes.jacobdanderson.net https://images.unsplash.com https://jacobdanderson.s3.us-east-1.amazonaws.com; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://api.github.com https://raw.githubusercontent.com; frame-src 'none'; media-src 'self' https://static.classes.jacobdanderson.net; worker-src 'none'; manifest-src 'self'"
Cross-Origin-Opener-Policy = "same-origin"
Cross-Origin-Resource-Policy = "same-origin"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), geolocation=(), microphone=()"
X-Frame-Options = "DENY"

