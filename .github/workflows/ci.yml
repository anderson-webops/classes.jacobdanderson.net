    course-workflows:
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: 24.18.0
                  cache: npm
            - name: Pin npm version
              run: |
                  npm i -g npm@12.0.1
                  npm -v
                  test "$(npm --version)" = "12.0.1"
            - name: Install deps
              run: npm ci
            - name: Build front-end
              run: npm run -w front-end build
            - name: Verify and record the complete normalized course catalog
              env:
                  COURSE_CATALOG_PROOF_DIR: ${{ github.workspace }}/output/course-catalog
              run: npm exec -w front-end -- vitest run test/store.courses.catalog-identities.spec.test.ts --no-file-parallelism --maxWorkers=1

            - name: Retain normalized course catalog evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: course-catalog-workflows
                  path: output/course-catalog/
                  if-no-files-found: error
                  retention-days: 7

            - name: Verify notification source imports and saved code exports
              env:
                  WEB_NOTIFICATION_EXPORT_DIR: output/web-notification-exports
              run: npm exec -w front-end -- vitest run test/web-notification-workspace.spec.test.ts --no-file-parallelism --maxWorkers=1

            - name: Run actual exported notification projects and contracts
              run: node test/web-notification-exported-contracts.mjs --exports front-end/output/web-notification-exports --proof output/web-notification-native/proof.json

            - name: Retain notification source and native export evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: web-notification-workflows
                  path: |
                      front-end/output/web-notification-exports/
                      output/web-notification-native/
                  if-no-files-found: error
                  retention-days: 7

            - name: Verify Network Systems foundation imports and notebook reuse
              env:
                  NETWORK_BROWSER_EXPORT_PROOF_DIR: output/network-exports
                  COURSE_IMPORT_SCREENSHOT_DIR: output/playwright
              run: node --test test/network-course-import-browser.test.mjs

            - name: Install disposable Network lab tools
              run: |
                  sudo apt-get update
                  sudo apt-get install --no-install-recommends --yes iproute2 iptables util-linux curl dnsutils tcpdump dnsmasq-base bash strace

            - name: Verify actual exported Network capstone contracts
              run: sudo env PYTHONDONTWRITEBYTECODE=1 python3 test/network-capstone-exported-contracts.py output/network-exports

            - name: Verify actual exported Network setup investigations
              run: python3 test/network-setup-exported-contracts.py output/network-exports

            - name: Verify actual exported Network transport investigations
              run: python3 test/network-transport-exported-contracts.py output/network-exports

            - name: Verify actual exported socket inventory investigations
              env:
                  NETWORK_BROWSER_EXPORT_PROOF_DIR: output/network-exports
              run: python3 test/network-inventory-exported-contracts.py output/network-exports

            - name: Retain Network Systems foundation workflow evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: network-foundations-workflows
                  path: |
                      output/network-exports/
                      output/playwright/course-import-network-*.png
                  if-no-files-found: ignore
                  retention-days: 7

            - name: Verify PyGames course workflows and pinned original game runtime
              env:
                  PYGAMES_BROWSER_EXPORT_PROOF_DIR: output/pygames-exports
              run: node --test test/pygames-course-workflows-browser.test.mjs

            - name: Retain PyGames source, media and browser evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: pygames-course-workflows
                  path: output/pygames-exports/
                  if-no-files-found: error
                  retention-days: 7

            - name: Verify class loops and execution limits
              run: python3 test/python-runtime-loop-guards.test.py

            - name: Verify self-contained PyGames core imports and saved continuations
              env:
                  PYGAMES_CORE_BROWSER_PROOF_DIR: output/pygames-core-exports
              run: node --test test/pygames-core-browser.test.mjs

            - name: Retain PyGames core browser workflow evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: pygames-core-browser-workflows
                  path: output/pygames-core-exports/
                  if-no-files-found: error
                  retention-days: 14

