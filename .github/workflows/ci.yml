name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    backend-install:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.18.0
                  cache: npm
                  cache-dependency-path: back-end/package-lock.json

            - name: Pin npm version
              run: |
                  npm -v
                  npm i -g npm@12.0.1
                  npm -v
                  test "$(npm --version)" = "12.0.1"

            - name: Verify standalone backend install policy
              run: node --test test/standalone-backend-install-policy.test.mjs

            - name: Install backend deps with backend lockfile
              working-directory: back-end
              run: npm ci --include=optional --strict-allow-scripts --workspaces=false

            - name: Validate backend dependency tree
              working-directory: back-end
              run: npm ls --all --workspaces=false

            - name: Audit backend dependency tree
              working-directory: back-end
              run: npm audit --include=optional --workspaces=false

    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.18.0
                  cache: npm

            # Make runner's npm match packageManager in package.json
            - name: Pin npm version
              run: |
                  npm -v
                  npm i -g npm@12.0.1
                  npm -v
                  test "$(npm --version)" = "12.0.1"

            - name: Install deps
              run: npm ci

            - name: Validate dependency tree
              run: npm run check:dependencies

            - name: Dependency security audit
              run: npm audit --include=optional

            # Root "lint" runs front-end and back-end lint
            - name: Lint
              run: npm run lint

    typecheck:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.18.0
                  cache: npm

            - name: Pin npm version
              run: |
                  npm i -g npm@12.0.1
                  npm -v
                  test "$(npm --version)" = "12.0.1"

            - name: Install deps
              run: npm ci

            - name: Typecheck
              run: npm run typecheck

    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [24.18.0]
                os: [ubuntu-latest]
            fail-fast: false

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ matrix['node-version'] }}
                  cache: npm
                  registry-url: https://registry.npmjs.org/

            - name: Pin npm version
              run: |
                  npm i -g npm@12.0.1
                  npm -v
                  test "$(npm --version)" = "12.0.1"

            - name: Install deps
              run: npm ci

            - name: Unit tests
              env:
                  VITEST_WATCH: "false"
              run: |
                  ulimit -n 4096 || true
                  npm run -w front-end test:unit

            - name: Backend tests
              env:
                  VITEST_WATCH: "false"
              run: npm run -w back-end test

            - name: Native deployment contract tests
              run: npm run test:native-deployment

    accessibility:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.18.0
                  cache: npm

            - name: Pin npm version
              run: |
                  npm i -g npm@12.0.1
                  npm -v
                  test "$(npm --version)" = "12.0.1"

            - name: Install deps
              run: npm ci

            - name: Axe accessibility smoke checks
              run: npm run a11y

    static-media:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.18.0
                  cache: npm

            - name: Pin npm version
              run: |
                  npm i -g npm@12.0.1
                  npm -v
                  test "$(npm --version)" = "12.0.1"

            - name: Install deps
              run: npm ci

            - name: Static media fetch policy tests
              run: npm run test:static-media-fetch

            - name: Audit static course media
              run: npm run audit:static-media

    native-nginx:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.18.0

            - name: Install native Nginx fixture dependency
              run: |
                  if ! command -v nginx >/dev/null 2>&1; then
                    sudo apt-get update
                    sudo apt-get install --no-install-recommends --yes nginx
                  fi

            - name: Exercise native Nginx routing
              run: npm run test:native-nginx

    test-e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.18.0
                  cache: npm
                  registry-url: https://registry.npmjs.org/

            - name: Pin npm version
              run: |
                  npm i -g npm@12.0.1
                  npm -v
                  test "$(npm --version)" = "12.0.1"

            - name: Install deps
              run: npm ci

            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/Cypress
                  key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

            - name: Build front-end
              run: npm run -w front-end build

            - name: Cypress
              uses: cypress-io/github-action@fa4a118725a8f001170d49631ea89e5d66fee626 # v7.4.1
              with:
                  install: false
                  working-directory: front-end
                  config-file: cypress.config.ts
                  start: npm run preview -- --port 3333
                  wait-on: "http://localhost:3333"

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.18.0
                  cache: npm

            - name: Pin npm version
              run: |
                  npm i -g npm@12.0.1
                  npm -v
                  test "$(npm --version)" = "12.0.1"

            - name: Install deps
              run: npm ci

            - name: Build
              run: npm run build
