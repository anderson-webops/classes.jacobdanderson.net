            - name: Prepare the disposable Linux user manager and journal
              run: |
                  sudo apt-get update
                  sudo apt-get install --no-install-recommends --yes dbus-user-session logrotate iproute2 iputils-ping curl dnsutils coreutils util-linux tar
                  native_lab_uid=$(id -u)
                  native_lab_user=$(id -un)
                  native_lab_runtime=/run/user/$native_lab_uid
                  sudo loginctl enable-linger "$native_lab_user"
                  sudo systemctl start "user@$native_lab_uid.service"
                  sudo install -d -m 2755 -o root -g systemd-journal /var/log/journal
                  sudo journalctl --flush
                  printf 'XDG_RUNTIME_DIR=%s\nDBUS_SESSION_BUS_ADDRESS=unix:path=%s/bus\n' "$native_lab_runtime" "$native_lab_runtime" >>"$GITHUB_ENV"

