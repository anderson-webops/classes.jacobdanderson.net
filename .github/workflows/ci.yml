            - name: Verify actual boundary-review course actions and saved continuations
              env:
                  COURSE_IMPORT_SCREENSHOT_DIR: output/rust-boundary-review-screenshots
                  RUST_BOUNDARY_REVIEW_BROWSER_PROOF_DIR: output/rust-boundary-review-browser
              run: node --test test/rust-boundary-review-course-browser.test.mjs

            - name: Compile original and browser-edited boundary-review exports without Git
              run: python3 test/rust-cargo-exported-contracts.py --lesson boundary-review --exports front-end/output/rust-boundary-review-exports --browser output/rust-boundary-review-browser --proof output/rust-boundary-review-native/proof.json

            - name: Retain boundary-review browser and native evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: rust-boundary-review-workflows
                  path: |
                      front-end/output/rust-boundary-review-exports/
                      output/rust-boundary-review-browser/
                      output/rust-boundary-review-native/
                      output/rust-boundary-review-screenshots/
