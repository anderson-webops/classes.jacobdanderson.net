              with:
                  name: rust-label-slices-workflows
                  path: |
                      front-end/output/rust-label-slices-exports/
                      output/rust-label-slices-browser/
                      output/rust-label-slices-native/
                      output/rust-label-slices-screenshots/
                  include-hidden-files: true
                  if-no-files-found: error
                  retention-days: 7

            - name: Verify complete state-models imports and source exports
              env:
                  RUST_STATE_MODELS_EXPORT_PROOF_DIR: output/rust-state-models-exports
              run: npm exec -w front-end -- vitest run test/rust-state-models-workspace.spec.test.ts --no-file-parallelism --maxWorkers=1

            - name: Verify actual state-models course actions and saved continuations
              env:
                  COURSE_IMPORT_SCREENSHOT_DIR: output/rust-state-models-screenshots
                  RUST_STATE_MODELS_BROWSER_PROOF_DIR: output/rust-state-models-browser
              run: node --test test/rust-state-models-course-browser.test.mjs

            - name: Compile original and browser-edited state-models exports
              run: python3 test/rust-cargo-exported-contracts.py --lesson state-models --exports front-end/output/rust-state-models-exports --browser output/rust-state-models-browser --proof output/rust-state-models-native/proof.json

            - name: Retain state-models browser and native evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: rust-state-models-workflows
                  path: |
                      front-end/output/rust-state-models-exports/
                      output/rust-state-models-browser/
                      output/rust-state-models-native/
                      output/rust-state-models-screenshots/
                  include-hidden-files: true
                  if-no-files-found: error
                  retention-days: 7

            - name: Verify complete trait-pipeline imports and source exports
              env:
                  RUST_TRAIT_PIPELINE_EXPORT_PROOF_DIR: output/rust-trait-pipeline-exports
              run: npm exec -w front-end -- vitest run test/rust-trait-pipeline-workspace.spec.test.ts --no-file-parallelism --maxWorkers=1

            - name: Verify actual trait-pipeline course actions and saved continuations
              env:
                  COURSE_IMPORT_SCREENSHOT_DIR: output/rust-trait-pipeline-screenshots
                  RUST_TRAIT_PIPELINE_BROWSER_PROOF_DIR: output/rust-trait-pipeline-browser
              run: node --test test/rust-trait-pipeline-course-browser.test.mjs

            - name: Compile original and browser-edited trait-pipeline exports
              run: python3 test/rust-cargo-exported-contracts.py --lesson trait-pipeline --exports front-end/output/rust-trait-pipeline-exports --browser output/rust-trait-pipeline-browser --proof output/rust-trait-pipeline-native/proof.json

            - name: Retain trait-pipeline browser and native evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: rust-trait-pipeline-workflows
                  path: |
                      front-end/output/rust-trait-pipeline-exports/
                      output/rust-trait-pipeline-browser/
                      output/rust-trait-pipeline-native/
                      output/rust-trait-pipeline-screenshots/
                  include-hidden-files: true
                  if-no-files-found: error
                  retention-days: 7

            - name: Verify complete bounded-cli imports and source exports
              env:
                  RUST_BOUNDED_CLI_EXPORT_PROOF_DIR: output/rust-bounded-cli-exports
              run: npm exec -w front-end -- vitest run test/rust-bounded-cli-workspace.spec.test.ts --no-file-parallelism --maxWorkers=1

            - name: Verify actual bounded-cli course actions and saved continuations
              env:
                  COURSE_IMPORT_SCREENSHOT_DIR: output/rust-bounded-cli-screenshots
                  RUST_BOUNDED_CLI_BROWSER_PROOF_DIR: output/rust-bounded-cli-browser
              run: node --test test/rust-bounded-cli-course-browser.test.mjs

            - name: Compile original and browser-edited bounded-cli exports
              run: python3 test/rust-cargo-exported-contracts.py --lesson bounded-cli --exports front-end/output/rust-bounded-cli-exports --browser output/rust-bounded-cli-browser --proof output/rust-bounded-cli-native/proof.json

            - name: Retain bounded-cli browser and native evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: rust-bounded-cli-workflows
                  path: |
                      front-end/output/rust-bounded-cli-exports/
                      output/rust-bounded-cli-browser/
                      output/rust-bounded-cli-native/
                      output/rust-bounded-cli-screenshots/
                  include-hidden-files: true
                  if-no-files-found: error
                  retention-days: 7

            - name: Verify complete concurrency, boundary and capstone imports and exports
              env:
                  RUST_FINAL_EXPORT_PROOF_DIR: output
              run: npm exec -w front-end -- vitest run test/rust-final-workspaces.spec.test.ts --no-file-parallelism --maxWorkers=1

            - name: Verify actual concurrency course actions and saved continuations
              env:
                  COURSE_IMPORT_SCREENSHOT_DIR: output/rust-concurrency-screenshots
                  RUST_CONCURRENCY_BROWSER_PROOF_DIR: output/rust-concurrency-browser
              run: node --test test/rust-concurrency-course-browser.test.mjs

            - name: Compile original and browser-edited concurrency exports without Git
              run: python3 test/rust-cargo-exported-contracts.py --lesson concurrency --exports front-end/output/rust-concurrency-exports --browser output/rust-concurrency-browser --proof output/rust-concurrency-native/proof.json

            - name: Retain concurrency browser and native evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: rust-concurrency-workflows
                  path: |
                      front-end/output/rust-concurrency-exports/
                      output/rust-concurrency-browser/
                      output/rust-concurrency-native/
                      output/rust-concurrency-screenshots/
                  include-hidden-files: true
