            - name: Verify actual record-hardening course actions and saved continuations
              env:
                  COURSE_IMPORT_SCREENSHOT_DIR: output/rust-record-hardening-screenshots
                  RUST_RECORD_HARDENING_BROWSER_PROOF_DIR: output/rust-record-hardening-browser
              run: node --test test/rust-record-hardening-course-browser.test.mjs

            - name: Compile original and browser-edited record-hardening exports without Git
              run: python3 test/rust-cargo-exported-contracts.py --lesson record-hardening --exports front-end/output/rust-record-hardening-exports --browser output/rust-record-hardening-browser --proof output/rust-record-hardening-native/proof.json

            - name: Retain record-hardening browser and native evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: rust-record-hardening-workflows
                  path: |
                      front-end/output/rust-record-hardening-exports/
                      output/rust-record-hardening-browser/
                      output/rust-record-hardening-native/
                      output/rust-record-hardening-screenshots/
                  include-hidden-files: true
                  if-no-files-found: error
                  retention-days: 7

    backend-install:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.18.0
                  cache: npm
                  cache-dependency-path: back-end/package-lock.json

            - name: Pin npm version
              run: |
                  npm -v
                  npm i -g npm@12.0.1
                  npm -v
                  test "$(npm --version)" = "12.0.1"

            - name: Verify standalone backend install policy
              run: node --test test/standalone-backend-install-policy.test.mjs

            - name: Install backend deps with backend lockfile
              working-directory: back-end
              run: npm ci --include=optional --strict-allow-scripts --workspaces=false

            - name: Validate backend dependency tree
              working-directory: back-end
              run: npm ls --all --workspaces=false

            - name: Audit backend dependency tree
              working-directory: back-end
              run: npm audit --include=optional --workspaces=false

    lint:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.18.0
                  cache: npm

            # Make runner's npm match packageManager in package.json
            - name: Pin npm version
              run: |
                  npm -v
                  npm i -g npm@12.0.1
                  npm -v
                  test "$(npm --version)" = "12.0.1"

            - name: Install deps
              run: npm ci

            - name: Validate dependency tree
              run: npm run check:dependencies

            - name: Verify root lock provenance
              run: npm run test:lock-provenance

            - name: Dependency security audit
              run: npm audit --include=optional

            - name: Brace parser security and compatibility regressions
              run: npm run test:braces-security

            - name: Dependency advisory compatibility regressions
              run: node --test --test-timeout=10000 test/dependency-advisory-regressions.test.mjs

            # Root "lint" runs front-end and back-end lint
            - name: Lint
              run: npm run lint

    typecheck:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.18.0
                  cache: npm

            - name: Pin npm version
              run: |
                  npm i -g npm@12.0.1
                  npm -v
                  test "$(npm --version)" = "12.0.1"

            - name: Install deps
              run: npm ci

            - name: Typecheck
              run: npm run typecheck

    test:
        runs-on: ubuntu-24.04
        strategy:
            matrix:
                node-version: [24.18.0]
                os: [ubuntu-24.04]
            fail-fast: false

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ matrix['node-version'] }}
                  cache: npm
                  registry-url: https://registry.npmjs.org/

            - name: Pin npm version
              run: |
                  npm i -g npm@12.0.1
                  npm -v
                  test "$(npm --version)" = "12.0.1"

            - name: Install deps
              id: unit_dependencies
              run: npm ci

            - name: Unit tests
              env:
                  VITEST_WATCH: "false"
              run: |
                  ulimit -n 4096 || true
                  npm run -w front-end test:unit

            - name: Scratch first-lesson event and archive regressions
              run: node --test test/scratch-name-events.test.mjs

            - name: Preserve authored course source checks
              run: node --test test/course-source-readiness.test.mjs

            - name: Backend tests
              if: ${{ !cancelled() && steps.unit_dependencies.outcome == 'success' }}
              env:
                  VITEST_WATCH: "false"
              run: npm run -w back-end test

            - name: Native deployment contract tests
              run: npm run test:native-deployment

            - name: Turtle input compatibility
              run: python3 -B test/turtle-input-box.test.py

            - name: Verify root snapshot and separate runtime ownership
              run: sudo python3 -B test/native-candidate-ownership.test.py

    accessibility:
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.18.0
                  cache: npm

            - name: Pin npm version
              run: |
                  npm i -g npm@12.0.1
                  npm -v
                  test "$(npm --version)" = "12.0.1"

            - name: Install deps
              run: npm ci

            - name: Build front-end for accessibility checks
              run: npm run -w front-end build

            - name: Axe accessibility smoke checks
              run: npm run a11y

    static-media:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.18.0
                  cache: npm

            - name: Pin npm version
              run: |
                  npm i -g npm@12.0.1
                  npm -v
                  test "$(npm --version)" = "12.0.1"

            - name: Install deps
              run: npm ci

            - name: Static media fetch policy tests
              run: npm run test:static-media-fetch

            - name: Audit static course media
              run: npm run audit:static-media

    native-nginx:
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.18.0

            - name: Install native Nginx fixture dependency
              run: |
                  if ! command -v nginx >/dev/null 2>&1; then
                    sudo apt-get update
                    sudo apt-get install --no-install-recommends --yes nginx
                  fi

            - name: Exercise native Nginx routing
              run: npm run test:native-nginx

    test-e2e:
        runs-on: ubuntu-24.04
        timeout-minutes: 75
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.18.0
                  cache: npm
                  registry-url: https://registry.npmjs.org/

            - name: Pin npm version
              run: |
                  npm i -g npm@12.0.1
                  npm -v
                  test "$(npm --version)" = "12.0.1"

            - name: Install deps
              run: npm ci

            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/Cypress
                  key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

            - name: Build front-end
              run: npm run -w front-end build

            - name: Install native Assembly debugger
              run: sudo apt-get update && sudo apt-get install -y gdb binutils strace

            - name: Export Assembly default and pack workspaces
