name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    backend-install:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.18.0
                  cache: npm
                  cache-dependency-path: back-end/package-lock.json

            - name: Pin npm version
              run: |
                  npm -v
                  npm i -g npm@12.0.1
                  npm -v
                  test "$(npm --version)" = "12.0.1"

            - name: Verify standalone backend install policy
              run: node --test test/standalone-backend-install-policy.test.mjs

            - name: Install backend deps with backend lockfile
              working-directory: back-end
              run: npm ci --include=optional --strict-allow-scripts --workspaces=false

            - name: Validate backend dependency tree
              working-directory: back-end
              run: npm ls --all --workspaces=false

            - name: Audit backend dependency tree
              working-directory: back-end
              run: npm audit --include=optional --workspaces=false

    lint:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.18.0
                  cache: npm

            # Make runner's npm match packageManager in package.json
            - name: Pin npm version
              run: |
                  npm -v
                  npm i -g npm@12.0.1
                  npm -v
                  test "$(npm --version)" = "12.0.1"

            - name: Install deps
              run: npm ci

            - name: Validate dependency tree
              run: npm run check:dependencies

            - name: Verify root lock provenance
              run: npm run test:lock-provenance

            - name: Dependency security audit
              run: npm audit --include=optional

            - name: Brace parser security and compatibility regressions
              run: npm run test:braces-security

            - name: Dependency advisory compatibility regressions
              run: node --test --test-timeout=10000 test/dependency-advisory-regressions.test.mjs

            # Root "lint" runs front-end and back-end lint
            - name: Lint
              run: npm run lint

    typecheck:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.18.0
                  cache: npm

            - name: Pin npm version
              run: |
                  npm i -g npm@12.0.1
                  npm -v
                  test "$(npm --version)" = "12.0.1"

            - name: Install deps
              run: npm ci

            - name: Typecheck
              run: npm run typecheck

    test:
        runs-on: ubuntu-24.04
        strategy:
            matrix:
                node-version: [24.18.0]
                os: [ubuntu-24.04]
            fail-fast: false

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ matrix['node-version'] }}
                  cache: npm
                  registry-url: https://registry.npmjs.org/

            - name: Pin npm version
              run: |
                  npm i -g npm@12.0.1
                  npm -v
                  test "$(npm --version)" = "12.0.1"

            - name: Install deps
              run: npm ci

            - name: Unit tests
              env:
                  VITEST_WATCH: "false"
              run: |
                  ulimit -n 4096 || true
                  npm run -w front-end test:unit

            - name: Scratch first-lesson event and archive regressions
              run: node --test test/scratch-name-events.test.mjs

            - name: Preserve authored course source checks
              run: node --test test/course-source-readiness.test.mjs

            - name: Backend tests
              env:
                  VITEST_WATCH: "false"
              run: npm run -w back-end test

            - name: Native deployment contract tests
              run: npm run test:native-deployment

            - name: Turtle input compatibility
              run: python3 -B test/turtle-input-box.test.py

            - name: Verify root snapshot and separate runtime ownership
              run: sudo python3 -B test/native-candidate-ownership.test.py

    accessibility:
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.18.0
                  cache: npm

            - name: Pin npm version
              run: |
                  npm i -g npm@12.0.1
                  npm -v
                  test "$(npm --version)" = "12.0.1"

            - name: Install deps
              run: npm ci

            - name: Build front-end for accessibility checks
              run: npm run -w front-end build

            - name: Axe accessibility smoke checks
              run: npm run a11y

    static-media:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.18.0
                  cache: npm

            - name: Pin npm version
              run: |
                  npm i -g npm@12.0.1
                  npm -v
                  test "$(npm --version)" = "12.0.1"

            - name: Install deps
              run: npm ci

            - name: Static media fetch policy tests
              run: npm run test:static-media-fetch

            - name: Audit static course media
              run: npm run audit:static-media

    native-nginx:
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.18.0

            - name: Install native Nginx fixture dependency
              run: |
                  if ! command -v nginx >/dev/null 2>&1; then
                    sudo apt-get update
                    sudo apt-get install --no-install-recommends --yes nginx
                  fi

            - name: Exercise native Nginx routing
              run: npm run test:native-nginx

    test-e2e:
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.18.0
                  cache: npm
                  registry-url: https://registry.npmjs.org/

            - name: Pin npm version
              run: |
                  npm i -g npm@12.0.1
                  npm -v
                  test "$(npm --version)" = "12.0.1"

            - name: Install deps
              run: npm ci

            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/Cypress
                  key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

            - name: Build front-end
              run: npm run -w front-end build

            - name: Install native Assembly debugger
              run: sudo apt-get update && sudo apt-get install -y gdb binutils

            - name: Export Assembly default and pack workspaces
              run: ASSEMBLY_EXPORT_PROOF_DIR="$GITHUB_WORKSPACE/output/assembly-exports" npm exec -w front-end -- vitest run test/assembly-workspace.spec.test.ts test/assembly-calculator-workspace.spec.test.ts test/assembly-memory-workspace.spec.test.ts test/assembly-call-parser-workspace.spec.test.ts test/assembly-compiler-workspace.spec.test.ts test/assembly-debug-workspace.spec.test.ts test/assembly-performance-workspace.spec.test.ts test/assembly-hardening-workspace.spec.test.ts test/assembly-records-workspace.spec.test.ts test/assembly-arithmetic-workspace.spec.test.ts --no-file-parallelism --maxWorkers=1

            - name: Verify Assembly imports, saved source and ZIP exports
              env:
                  COURSE_IMPORT_SCREENSHOT_DIR: output/playwright
                  ASSEMBLY_BROWSER_EXPORT_PROOF_DIR: output/assembly-exports
              run: node --test test/assembly-course-import-browser.test.mjs

            - name: Verify Unit 1 actual course buttons and shared trace attempt
              env:
                  COURSE_IMPORT_SCREENSHOT_DIR: output/playwright
                  ASSEMBLY_RECORD_BROWSER_EXPORT_PROOF_DIR: output/assembly-record-course
              run: node --test test/assembly-record-course-browser.test.mjs

            - name: Verify Unit 3 actual course buttons and shared arithmetic trace
              env:
                  COURSE_IMPORT_SCREENSHOT_DIR: output/playwright
                  ASSEMBLY_ARITHMETIC_BROWSER_EXPORT_PROOF_DIR: output/assembly-arithmetic-course
              run: node --test test/assembly-arithmetic-course-browser.test.mjs

            - name: Verify Linux confirmed imports, notebook reuse and exact exports
              env:
                  LINUX_BROWSER_EXPORT_PROOF_DIR: output/linux-exports
              run: node --test test/linux-course-import-browser.test.mjs

            - name: Prepare the disposable Linux user manager and journal
              run: |
                  sudo apt-get update
                  sudo apt-get install --no-install-recommends --yes dbus-user-session logrotate iproute2 iputils-ping curl dnsutils coreutils util-linux tar
                  native_lab_uid=$(id -u)
                  native_lab_user=$(id -un)
                  native_lab_runtime=/run/user/$native_lab_uid
                  sudo loginctl enable-linger "$native_lab_user"
                  sudo systemctl start "user@$native_lab_uid.service"
                  sudo install -d -m 2755 -o root -g systemd-journal /var/log/journal
                  sudo journalctl --flush
                  printf 'XDG_RUNTIME_DIR=%s\nDBUS_SESSION_BUS_ADDRESS=unix:path=%s/bus\n' "$native_lab_runtime" "$native_lab_runtime" >>"$GITHUB_ENV"

            - name: Verify exported Linux lab contracts
              run: |
                  if ! command -v nginx >/dev/null 2>&1 || ! command -v apache2 >/dev/null 2>&1; then
                    sudo apt-get update
                    sudo apt-get install --no-install-recommends --yes nginx apache2-bin
                  fi
                  python3 test/linux-exported-contracts.py --archives output/linux-exports --proof output/linux-exports/exported-contracts.json

            - name: Retain Linux workflow and native validation
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: linux-workflow-validation
                  path: output/linux-exports/
                  if-no-files-found: error
                  retention-days: 7

            - name: Verify exported Assembly contracts and native debugger traces
              run: |
                  python3 test/assembly-exported-contracts.py --cc clang --archives output/assembly-exports --proof output/playwright/assembly-native-clang.json
                  python3 test/assembly-exported-contracts.py --cc gcc --archives output/assembly-exports --proof output/playwright/assembly-native-gcc.json
                  python3 test/assembly-exported-contracts.py --project calculator --cc clang --archives output/assembly-exports --proof output/playwright/assembly-calculator-native-clang.json
                  python3 test/assembly-exported-contracts.py --project calculator --cc gcc --archives output/assembly-exports --proof output/playwright/assembly-calculator-native-gcc.json
                  python3 test/assembly-exported-contracts.py --project array --cc clang --archives output/assembly-exports --proof output/playwright/assembly-array-native-clang.json
                  python3 test/assembly-exported-contracts.py --project array --cc gcc --archives output/assembly-exports --proof output/playwright/assembly-array-native-gcc.json
                  python3 test/assembly-exported-contracts.py --project string --cc clang --archives output/assembly-exports --proof output/playwright/assembly-string-native-clang.json
                  python3 test/assembly-exported-contracts.py --project string --cc gcc --archives output/assembly-exports --proof output/playwright/assembly-string-native-gcc.json
                  python3 test/assembly-exported-contracts.py --project helper --cc clang --archives output/assembly-exports --proof output/playwright/assembly-helper-native-clang.json
                  python3 test/assembly-exported-contracts.py --project helper --cc gcc --archives output/assembly-exports --proof output/playwright/assembly-helper-native-gcc.json
                  python3 test/assembly-exported-contracts.py --project parser --cc clang --archives output/assembly-exports --proof output/playwright/assembly-parser-native-clang.json
                  python3 test/assembly-exported-contracts.py --project parser --cc gcc --archives output/assembly-exports --proof output/playwright/assembly-parser-native-gcc.json
                  python3 test/assembly-exported-contracts.py --project reverse --cc clang --archives output/assembly-exports --proof output/playwright/assembly-reverse-native-clang.json
                  python3 test/assembly-exported-contracts.py --project reverse --cc gcc --archives output/assembly-exports --proof output/playwright/assembly-reverse-native-gcc.json
                  python3 test/assembly-exported-contracts.py --project stack --cc clang --archives output/assembly-exports --proof output/playwright/assembly-stack-native-clang.json
                  python3 test/assembly-exported-contracts.py --project stack --cc gcc --archives output/assembly-exports --proof output/playwright/assembly-stack-native-gcc.json
                  python3 test/assembly-exported-contracts.py --project compiler --cc clang --archives output/assembly-exports --proof output/playwright/assembly-compiler-native-clang.json
                  python3 test/assembly-exported-contracts.py --project compiler --cc gcc --archives output/assembly-exports --proof output/playwright/assembly-compiler-native-gcc.json
                  python3 test/assembly-exported-contracts.py --project debug --cc clang --archives output/assembly-exports --proof output/playwright/assembly-debug-native-clang.json
                  python3 test/assembly-exported-contracts.py --project debug --cc gcc --archives output/assembly-exports --proof output/playwright/assembly-debug-native-gcc.json
                  python3 test/assembly-exported-contracts.py --project performance --cc clang --archives output/assembly-exports --proof output/playwright/assembly-performance-native-clang.json
                  python3 test/assembly-exported-contracts.py --project performance --cc gcc --archives output/assembly-exports --proof output/playwright/assembly-performance-native-gcc.json
                  python3 test/assembly-exported-contracts.py --project hardening --cc clang --archives output/assembly-exports --proof output/playwright/assembly-hardening-native-clang.json
                  python3 test/assembly-exported-contracts.py --project hardening --cc gcc --archives output/assembly-exports --proof output/playwright/assembly-hardening-native-gcc.json
                  python3 test/assembly-exported-contracts.py --project records --cc clang --archives output/assembly-exports --proof output/playwright/assembly-records-native-clang.json
                  python3 test/assembly-exported-contracts.py --project records --cc gcc --archives output/assembly-exports --proof output/playwright/assembly-records-native-gcc.json
                  python3 test/assembly-exported-contracts.py --project arithmetic --cc clang --archives output/assembly-exports --proof output/playwright/assembly-arithmetic-native-clang.json
                  python3 test/assembly-exported-contracts.py --project arithmetic --cc gcc --archives output/assembly-exports --proof output/playwright/assembly-arithmetic-native-gcc.json

            - name: Retain Assembly workflow and native validation
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: assembly-workflow-validation
                  path: |
                      output/playwright/course-import-assembly-*.png
                      output/playwright/compiler-clang-generated/
                      output/playwright/compiler-gcc-generated/
                      output/playwright/debug-clang-traces/
                      output/playwright/debug-gcc-traces/
                      output/playwright/performance-clang-observations/
                      output/playwright/performance-gcc-observations/
                      output/playwright/hardening-observations-clang/
                      output/playwright/hardening-observations-gcc/
                      output/playwright/assembly-failure.png
                      output/playwright/assembly-*.json
                      output/playwright/assembly-*.jsonl
                      output/assembly-exports/
                      output/assembly-record-course/
                      output/assembly-arithmetic-course/
                  if-no-files-found: error
                  retention-days: 7

            - name: Verify native C17 imports, source editing and ZIP exports
              env:
                  COURSE_IMPORT_SCREENSHOT_DIR: output/playwright
                  C17_BROWSER_EXPORT_PROOF_DIR: output/c17-exports
              run: node --test test/c17-course-import-browser.test.mjs

            - name: Verify C17 studio readings and exported native contracts
              run: |
                  CSE_CC=clang python3 test/c17-studio-readings.py --archives output/c17-exports
                  CSE_CC=gcc python3 test/c17-studio-readings.py --archives output/c17-exports

            - name: Verify C17 unit readings and exported native contracts
              run: |
                  CSE_CC=clang python3 test/c17-unit-readings.py --archives output/c17-exports
                  CSE_CC=gcc python3 test/c17-unit-readings.py --archives output/c17-exports

            - name: Verify saved project role labels and deletion context
              env:
                  COURSE_IMPORT_SCREENSHOT_DIR: output/playwright
              run: node --test test/ide-saved-project-labels-browser.test.mjs

            - name: Verify Scratch classroom import, execution and downloads
              env:
                  SCRATCH_SCREENSHOT_DIR: output/playwright
              run: node --test test/scratch-projects.test.mjs test/scratch-browser.test.mjs

            - name: Retain Scratch conditional lesson screenshots
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: scratch-conditional-screenshots
                  path: front-end/output/playwright/scratch-conditionals-*.png
                  if-no-files-found: error
                  retention-days: 7

            - name: Verify bridge and C++ foundation import, export and native compilation
              env:
                  COURSE_IMPORT_SCREENSHOT_DIR: output/playwright
              run: JAVAC="$JAVA_HOME_21_X64/bin/javac" node --test test/cpp-course-import-browser.test.mjs

            - name: Retain C++ and Java workspace screenshots
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: cpp-workspace-screenshots
                  path: |
                      output/playwright/course-import-*.png
                      output/playwright/c17-workflow-proof.json
                      output/playwright/c17-studio-native-proof-*.json
                      output/playwright/c17-unit-native-proof-*.json
                  if-no-files-found: ignore
                  retention-days: 7

            - name: Verify Pygame surfaces in the browser IDE
              run: node --test test/pygame-browser-runtime.test.mjs

            - name: Verify private IDE diagnostics in the browser
              run: node --test test/ide-diagnostics-browser.test.mjs

            - name: Verify console scrolling and editor argument warnings
              run: node --test test/ide-console-browser.test.mjs

            - name: Verify Turtle manual updates and editor search contrast
              run: node --test test/turtle-tracer-browser.test.mjs

            - name: Verify inline booking and Classes navigation
              env:
                  BOOKING_SCREENSHOT_DIR: output/playwright
              run: node --test test/signup-browser.test.mjs

            - name: Retain booking screenshots
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: booking-screenshots
                  path: output/playwright/signup-*.png
                  if-no-files-found: ignore
                  retention-days: 7

            - name: Verify confirmed course imports and accessible errors
              env:
                  COURSE_IMPORT_SCREENSHOT_DIR: output/playwright
              run: node --test test/course-import-browser.test.mjs

            - name: Verify independent course reference imports and melody
              env:
                  COURSE_IMPORT_SCREENSHOT_DIR: output/playwright
              run: node --test test/course-reference-browser.test.mjs

            - name: Retain course import screenshots
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: course-import-screenshots
                  path: output/playwright/course-import-*.png
                  if-no-files-found: ignore
                  retention-days: 7

            - name: Cypress
              uses: cypress-io/github-action@fa4a118725a8f001170d49631ea89e5d66fee626 # v7.4.1
              with:
                  install: false
                  working-directory: front-end
                  config-file: cypress.config.ts
                  start: npm run preview -- --port 3333
                  wait-on: "http://localhost:3333"

    course-workflows:
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: 24.18.0
                  cache: npm
            - name: Pin npm version
              run: |
                  npm i -g npm@12.0.1
                  npm -v
                  test "$(npm --version)" = "12.0.1"
            - name: Install deps
              run: npm ci
            - name: Build front-end
              run: npm run -w front-end build
            - name: Verify and record the complete normalized course catalog
              env:
                  COURSE_CATALOG_PROOF_DIR: ${{ github.workspace }}/output/course-catalog
              run: npm exec -w front-end -- vitest run test/store.courses.catalog-identities.spec.test.ts --no-file-parallelism --maxWorkers=1

            - name: Retain normalized course catalog evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: course-catalog-workflows
                  path: output/course-catalog/
                  if-no-files-found: error
                  retention-days: 7

            - name: Verify Network Systems foundation imports and notebook reuse
              env:
                  NETWORK_BROWSER_EXPORT_PROOF_DIR: output/network-exports
                  COURSE_IMPORT_SCREENSHOT_DIR: output/playwright
              run: node --test test/network-course-import-browser.test.mjs

            - name: Install disposable Network lab tools
              run: |
                  sudo apt-get update
                  sudo apt-get install --no-install-recommends --yes iproute2 iptables util-linux curl dnsutils tcpdump dnsmasq-base bash strace

            - name: Verify actual exported Network capstone contracts
              run: sudo env PYTHONDONTWRITEBYTECODE=1 python3 test/network-capstone-exported-contracts.py output/network-exports

            - name: Verify actual exported Network setup investigations
              run: python3 test/network-setup-exported-contracts.py output/network-exports

            - name: Retain Network Systems foundation workflow evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: network-foundations-workflows
                  path: |
                      output/network-exports/
                      output/playwright/course-import-network-*.png
                  if-no-files-found: ignore
                  retention-days: 7

            - name: Verify PyGames course workflows and pinned original game runtime
              env:
                  PYGAMES_BROWSER_EXPORT_PROOF_DIR: output/pygames-exports
              run: node --test test/pygames-course-workflows-browser.test.mjs

            - name: Retain PyGames source, media and browser evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: pygames-course-workflows
                  path: output/pygames-exports/
                  if-no-files-found: error
                  retention-days: 7

    usaco-workflows:
        needs: test-e2e
        runs-on: ubuntu-24.04
        timeout-minutes: 55
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: 24.18.0
                  cache: npm
            - name: Pin npm version
              run: |
                  npm i -g npm@12.0.1
                  npm -v
                  test "$(npm --version)" = "12.0.1"
            - name: Install deps
              run: npm ci
            - name: Build front-end
              run: npm run -w front-end build
            - name: Verify restored USACO imports and native file I/O
              env:
                  COURSE_IMPORT_SCREENSHOT_DIR: output/playwright
              run: JAVAC="$JAVA_HOME_21_X64/bin/javac" JAVA="$JAVA_HOME_21_X64/bin/java" node --test test/usaco-course-import-browser.test.mjs

            - name: Retain USACO project workflow screenshots
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: usaco-workspace-screenshots
                  path: output/playwright/course-import-usaco-*.png
                  if-no-files-found: error
                  retention-days: 7

    build:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.18.0
                  cache: npm

            - name: Pin npm version
              run: |
                  npm i -g npm@12.0.1
                  npm -v
                  test "$(npm --version)" = "12.0.1"

            - name: Install deps
              run: npm ci

            - name: Build
              run: npm run build
