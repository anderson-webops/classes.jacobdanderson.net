name: Course preflight

run-name: ${{ inputs.course == 'native-release-evidence' && 'Native release file verification' || inputs.course == 'tracker-evidence' && 'Retained Tracker failure evidence' || inputs.course == 'scratch-tasks' && 'Published Scratch project tasks' || inputs.course == 'course-audit' && 'Course audit follow-ups' || inputs.course == 'scratch-readings' && 'Scratch and self-study readings' || inputs.course == 'scratch-originals' && 'Original Scratch imports' || inputs.course == 'bootcamp' && 'Scratch Bootcamp pages' || inputs.course == 'self-study' && 'Self-study course pages' || inputs.course == 'physics-models' && 'Physics model workflows' || inputs.course == 'networking' && 'Swift Networking source evidence' || inputs.course == 'ai-setup' && 'AI setup reading' || 'PyGames core preflight' }}

on:
  workflow_dispatch:
    inputs:
      course:
        description: Course verification to run
        type: choice
        options: [java-value-data, course-choices, javascript-checkpoints, javascript-snowflake, dependency-repair, java-ownership-move, java-composing, java-refactoring, java-studios, java-capstone, java-judgment, java-architecture, java-collaboration, java-behavioral, java-structural, java-boundary, java-creational, java-foundations, java-patterns, java-recursion, pygames, networking, ai-setup, self-study, physics-models, bootcamp, scratch-originals, scratch-readings, course-audit, scratch-tasks, tracker-evidence, native-release-evidence]
        default: pygames
      full_source_runtime:
        description: Also verify every pinned original PyGames runtime profile
        type: boolean
        default: false
      browser_run_id:
        description: Networking browser export workflow run
        type: string
      self_study_courses:
        description: Optional comma-separated self-study course IDs; validated by the browser check
        type: string
      browser_artifact_id:
        description: Networking browser export artifact
        type: string

      native_run_id:
        description: Retained native result producer run
        type: string
      native_artifact_id:
        description: Retained native result artifact
        type: string
      native_artifact_sha256:
        description: Independently verified original ZIP SHA256
        type: string

permissions:
  contents: read

concurrency:
  group: pygames-core-preflight-${{ github.ref }}-${{ inputs.course == 'course-choices' && 'course-choices' || (inputs.course == 'tracker-evidence' || inputs.course == 'native-release-evidence') && 'evidence' || 'validation' }}
  cancel-in-progress: false

jobs:


  course-choices:
    if: inputs.course == 'course-choices'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLASSES_FAMILY_TASK_ID: course-choices-${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - name: Pin npm and verify the root clean install
        run: |
          npm i -g npm@12.0.1
          test "$(npm --version)" = "12.0.1"
          node scripts/classes-family-heavy-task.mjs -- npm ci
      - name: Require root and production dependency audits
        run: |
          mkdir -p output/course-choices-validation/audits
          npm audit --include=optional --json > output/course-choices-validation/audits/root-full.json
          npm audit --include=optional --omit=dev --json > output/course-choices-validation/audits/root-production.json
      - name: Verify the standalone backend graph and both audits
        working-directory: back-end
        run: |
          node ../scripts/classes-family-heavy-task.mjs -- npm ci --include=optional --strict-allow-scripts --workspaces=false
          npm ls --all --workspaces=false
          npm audit --include=optional --workspaces=false --json > ../output/course-choices-validation/audits/backend-full.json
          npm audit --include=optional --omit=dev --workspaces=false --json > ../output/course-choices-validation/audits/backend-production.json
      - name: Verify public choices, retained subjects, paths and historical identities
        run: >-
          node scripts/classes-family-heavy-task.mjs --
          npm exec -w front-end -- vitest run
          test/course-choice-visibility.spec.test.ts
          test/components.role-workspaces.spec.test.ts
          test/store.courses.public-pathways.spec.test.ts
          test/components.courseexplorer-inventory.spec.test.ts
          test/components.courseexplorer.spec.test.ts
          test/store.courses.catalog-identities.spec.test.ts
          test/store.courses.progress-identity.spec.test.ts
          --no-file-parallelism --maxWorkers=1
          --reporter=default --reporter=json
          --outputFile=../output/course-choices-validation/tests.json
      - name: Lint, typecheck and build both workspaces
        run: |
          node scripts/classes-family-heavy-task.mjs -- npm run lint
          node scripts/classes-family-heavy-task.mjs -- npm run typecheck
          node scripts/classes-family-heavy-task.mjs -- npm run build
      - name: Retain course choice and dependency validation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: course-choices-validation
          path: output/course-choices-validation/
          if-no-files-found: error
          retention-days: 14

  javascript-checkpoints:
    if: inputs.course == 'javascript-checkpoints'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLASSES_FAMILY_TASK_ID: javascript-checkpoint-${{ github.run_id }}
      JAVASCRIPT_CHECKPOINT_BROWSER_DIR: output/javascript-checkpoint-browser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - name: Pin npm and verify the root clean install
        run: |
          npm i -g npm@12.0.1
          test "$(npm --version)" = "12.0.1"
          node scripts/classes-family-heavy-task.mjs -- npm ci
      - name: Require root and production dependency audits
        run: |
          mkdir -p output/javascript-checkpoint-browser/audits
          npm audit --include=optional --json > output/javascript-checkpoint-browser/audits/root-full.json
          npm audit --include=optional --omit=dev --json > output/javascript-checkpoint-browser/audits/root-production.json
      - name: Verify the standalone backend graph and both audits
        working-directory: back-end
        run: |
          node ../scripts/classes-family-heavy-task.mjs -- npm ci --include=optional --strict-allow-scripts --workspaces=false
          npm ls --all --workspaces=false
          npm audit --include=optional --workspaces=false --json > ../output/javascript-checkpoint-browser/audits/backend-full.json
          npm audit --include=optional --omit=dev --workspaces=false --json > ../output/javascript-checkpoint-browser/audits/backend-production.json
      - name: Verify source roles, originals, saved projects and published identities
        run: >-
          node scripts/classes-family-heavy-task.mjs --
          npm exec -w front-end -- vitest run
          test/javascript-checkpoint-workspace.spec.test.ts
          test/store.courses.catalog-identities.spec.test.ts
          test/store.courses.progress-identity.spec.test.ts
          test/store.courses.javascript-level-1-flow.spec.test.ts
          test/store.courses.quality.spec.test.ts
          test/store.courses.implementation-artifacts.spec.test.ts
          --no-file-parallelism --maxWorkers=1
      - name: Lint, typecheck and build both workspaces
        run: |
          node scripts/classes-family-heavy-task.mjs -- npm run lint
          node scripts/classes-family-heavy-task.mjs -- npm run typecheck
          node scripts/classes-family-heavy-task.mjs -- npm run build
      - name: Verify original course buttons, consent, edits and actual ZIP exports
        run: |
          node scripts/classes-family-heavy-task.mjs -- node --test test/javascript-checkpoint-course-browser.test.mjs
          node scripts/classes-family-heavy-task.mjs -- node --test test/javascript-checkpoint-exported-browser.test.mjs
      - name: Retain source, actual exports and rendered evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: javascript-checkpoint-source-workflows
          path: output/javascript-checkpoint-browser/
          if-no-files-found: error
          retention-days: 14

  javascript-snowflake:
    if: inputs.course == 'javascript-snowflake'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLASSES_FAMILY_TASK_ID: javascript-snowflake-${{ github.run_id }}
      JAVASCRIPT_SNOWFLAKE_BROWSER_DIR: output/javascript-snowflake-browser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - name: Pin npm and verify the root clean install
        run: |
          npm i -g npm@12.0.1
          test "$(npm --version)" = "12.0.1"
          node scripts/classes-family-heavy-task.mjs -- npm ci
      - name: Require root and production dependency audits
        run: |
          mkdir -p output/javascript-snowflake-browser/audits
          npm audit --include=optional --json > output/javascript-snowflake-browser/audits/root-full.json
          npm audit --include=optional --omit=dev --json > output/javascript-snowflake-browser/audits/root-production.json
      - name: Verify the standalone backend graph and both audits
        working-directory: back-end
        run: |
          node ../scripts/classes-family-heavy-task.mjs -- npm ci --include=optional --strict-allow-scripts --workspaces=false
          npm ls --all --workspaces=false
          npm audit --include=optional --workspaces=false --json > ../output/javascript-snowflake-browser/audits/backend-full.json
          npm audit --include=optional --omit=dev --workspaces=false --json > ../output/javascript-snowflake-browser/audits/backend-production.json
      - name: Verify source roles, originals, saved projects and published identities
        run: >-
          node scripts/classes-family-heavy-task.mjs --
          npm exec -w front-end -- vitest run
          test/javascript-snowflake-workspace.spec.test.ts
          test/store.courses.catalog-identities.spec.test.ts
          test/store.courses.progress-identity.spec.test.ts
          test/store.courses.javascript-level-1-flow.spec.test.ts
          test/store.courses.quality.spec.test.ts
          test/store.courses.implementation-artifacts.spec.test.ts
          --no-file-parallelism --maxWorkers=1
      - name: Lint, typecheck and build both workspaces
        run: |
          node scripts/classes-family-heavy-task.mjs -- npm run lint
          node scripts/classes-family-heavy-task.mjs -- npm run typecheck
          node scripts/classes-family-heavy-task.mjs -- npm run build
      - name: Verify original course buttons, consent, edits and actual ZIP exports
        run: |
          node scripts/classes-family-heavy-task.mjs -- node --test test/javascript-snowflake-course-browser.test.mjs
          node scripts/classes-family-heavy-task.mjs -- node --test test/javascript-snowflake-exported-browser.test.mjs
      - name: Retain source, actual exports and rendered evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: javascript-snowflake-source-workflows
          path: output/javascript-snowflake-browser/
          if-no-files-found: error
          retention-days: 14

  dependency-repair:
    if: inputs.course == 'dependency-repair'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLASSES_FAMILY_TASK_ID: course-audit-dependency-repair
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
          registry-url: https://registry.npmjs.org/
      - name: Pin npm version
        run: |
          npm i -g npm@12.0.1
          test "$(npm --version)" = "12.0.1"
      - name: Record original graphs and dependency freshness
        run: |
          mkdir -p output/security-dependency-repair/before
          python3 - <<'PY'
          import hashlib,json,pathlib,shutil,subprocess
          out=pathlib.Path("output/security-dependency-repair")
          files=["package.json","front-end/package.json","back-end/package.json","package-lock.json","back-end/package-lock.json"]
          inventory={}
          for name in files:
              src=pathlib.Path(name)
              dest=out/"before"/name
              dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(src,dest)
              value=json.loads(src.read_text())
              inventory[name]={"sha256":hashlib.sha256(src.read_bytes()).hexdigest(),"dependencies":value.get("dependencies",{}),"devDependencies":value.get("devDependencies",{})}
          (out/"before.json").write_text(json.dumps({"source":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),"graphs":inventory},indent=2)+"\n")
          PY
          set +e
          npm outdated --workspaces --long --json > output/security-dependency-repair/freshness-before.json
          status=$?
          set -e
          test "$status" -eq 0 -o "$status" -eq 1
      - name: Prepare the supported Mongoose update and both lockfiles
        run: |
          node scripts/classes-family-heavy-task.mjs -- npm install -w back-end mongoose@9.12.1 --package-lock-only --ignore-scripts --no-fund --no-audit
          cd back-end
          node ../scripts/classes-family-heavy-task.mjs -- npm install --package-lock-only --ignore-scripts --no-fund --no-audit --workspaces=false
      - name: Verify the clean root install and complete dependency tree
        run: |
          node scripts/classes-family-heavy-task.mjs -- npm ci
          npm run check:dependencies
          npm run test:lock-provenance
      - name: Require clean full and production root audits
        run: |
          npm audit --include=optional --json > output/security-dependency-repair/root-full.json
          npm audit --include=optional --omit=dev --json > output/security-dependency-repair/root-production.json
      - name: Verify lint, types, build and application tests
        run: |
          node scripts/classes-family-heavy-task.mjs -- npm run lint
          node scripts/classes-family-heavy-task.mjs -- npm run typecheck
          node scripts/classes-family-heavy-task.mjs -- npm run build
          node scripts/classes-family-heavy-task.mjs -- npm run -w back-end test
          node scripts/classes-family-heavy-task.mjs -- npm run -w front-end test:unit
          npm run test:braces-security
          node --test --test-timeout=10000 test/dependency-advisory-regressions.test.mjs
      - name: Verify the standalone backend locked install and audits
        working-directory: back-end
        run: |
          node ../scripts/classes-family-heavy-task.mjs -- npm ci --include=optional --strict-allow-scripts --workspaces=false
          npm ls --all --workspaces=false
          npm audit --include=optional --workspaces=false --json > ../output/security-dependency-repair/backend-full.json
          npm audit --include=optional --omit=dev --workspaces=false --json > ../output/security-dependency-repair/backend-production.json
      - name: Recheck types after build-generated declarations
        run: node scripts/classes-family-heavy-task.mjs -- npm run typecheck
      - name: Retain the exact validated candidate bytes
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,shutil,subprocess
          out=pathlib.Path("output/security-dependency-repair")
          files=["back-end/package.json","package-lock.json","back-end/package-lock.json"]
          changed=subprocess.check_output(["git","diff","--name-only"],text=True).splitlines()
          (out/"candidate.diff").write_bytes(subprocess.check_output(["git","diff","--binary"]))
          generated="front-end/src/components.d.ts"
          declaration_changes=[name for name in changed if name==generated]
          if declaration_changes:
              dest=out/"generated"/generated
              dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(generated,dest)
              (out/"generated-declaration-before.txt").write_bytes(subprocess.check_output(["git","show","HEAD:"+generated]))
          hashes={}
          for name in files:
              src=pathlib.Path(name)
              dest=out/"candidate"/name
              dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(src,dest)
              hashes[name]=hashlib.sha256(src.read_bytes()).hexdigest()
          assert set(files)<=set(changed) and set(changed)-set(files)<=set(declaration_changes),changed
          for name in ["root-full","root-production","backend-full","backend-production"]:
              assert json.loads((out/(name+".json")).read_text())["metadata"]["vulnerabilities"]["total"]==0
          for name in ["package-lock.json","back-end/package-lock.json"]:
              lock=json.loads(pathlib.Path(name).read_text())
              assert lock["packages"]["node_modules/mongoose"]["version"]=="9.12.1"
          before=json.loads((out/"before.json").read_text())
          (out/"accepted.json").write_text(json.dumps({"accepted":True,"source":before["source"],"candidateHashes":hashes,"cleanRootInstall":True,"cleanStandaloneBackendInstall":True,"lint":True,"typecheck":True,"build":True,"backendTests":True,"frontendUnitTests":True,"fourZeroVulnerabilityAudits":True,"generatedDeclarationReviewPending":declaration_changes,"publishedOrDeployed":False},indent=2)+"\n")
          PY
          cp /tmp/classes-family-heavy-tasks.log output/security-dependency-repair/processes.jsonl
      - name: Retain candidate files and validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: security-dependency-repair
          path: output/security-dependency-repair/
          if-no-files-found: error
          retention-days: 14

  native-release-evidence:
    if: inputs.course == 'native-release-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/verify-native-release-evidence.py
            /test/native-release-evidence-selection.test.py
      - name: Verify native producer selection boundaries
        run: python3 -B test/native-release-evidence-selection.test.py
      - name: Authenticate the native CI producer and annotated tag
        id: producer
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN_ID: ${{ inputs.native_run_id }}
          NATIVE_ARTIFACT_ID: ${{ inputs.native_artifact_id }}
          NATIVE_SHA256: ${{ inputs.native_artifact_sha256 }}
        run: >-
          python3 scripts/verify-native-release-evidence.py
          --run-id "$NATIVE_RUN_ID" --artifact-id "$NATIVE_ARTIFACT_ID"
          --sha256 "$NATIVE_SHA256" --output output/native-release-evidence --describe
      - name: Read the independently trusted release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.producer.outputs.tag }}
          path: .native-trusted
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
            /front-end/package.json
            /back-end/package.json
            /back-end/package-lock.json
            /scripts/verify-native-source.sh
            /scripts/verify-native-release.mjs
            /deploy/native/
      - name: Verify the unchanged archive, every payload file and both signed subjects
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN_ID: ${{ inputs.native_run_id }}
          NATIVE_ARTIFACT_ID: ${{ inputs.native_artifact_id }}
          NATIVE_SHA256: ${{ inputs.native_artifact_sha256 }}
        run: >-
          python3 scripts/verify-native-release-evidence.py
          --run-id "$NATIVE_RUN_ID" --artifact-id "$NATIVE_ARTIFACT_ID"
          --sha256 "$NATIVE_SHA256" --output output/native-release-evidence
          --trusted .native-trusted
      - name: Retain native release verification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-release-independent-evidence
          path: output/native-release-evidence/
          if-no-files-found: error
          retention-days: 14

  tracker-evidence:
    if: inputs.course == 'tracker-evidence'
    runs-on: macos-26
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify bounded retained native result selection
        run: python3 test/native-ui-evidence-selection.test.py
      - name: Inspect the unchanged original native failure
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN_ID: ${{ inputs.native_run_id }}
          NATIVE_ARTIFACT_ID: ${{ inputs.native_artifact_id }}
          NATIVE_SHA256: ${{ inputs.native_artifact_sha256 }}
        run: >-
          python3 scripts/inspect-native-ui-evidence.py
          --run-id "$NATIVE_RUN_ID"
          --artifact-id "$NATIVE_ARTIFACT_ID"
          --sha256 "$NATIVE_SHA256"
          --output output/native-evidence
      - name: Retain original failure analysis
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-tracker-failure-analysis
          path: output/native-evidence/
          if-no-files-found: error
          retention-days: 14

  preflight:
    if: inputs.course == 'pygames'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CLASSES_FAMILY_TASK_ID: pygames-core-preflight-${{ github.run_id }}
      COURSE_CATALOG_PROOF_DIR: ${{ github.workspace }}/output/pygames-core-preflight/catalog
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - name: Pin the supported npm toolchain
        run: npm install --global npm@12.0.1
      - name: Verify root clean install
        run: node scripts/classes-family-heavy-task.mjs -- npm ci
      - name: Lint both workspaces
        run: node scripts/classes-family-heavy-task.mjs -- npm run lint
      - name: Check both workspace types
        run: node scripts/classes-family-heavy-task.mjs -- npm run typecheck
      - name: Verify core imports, saved files, ZIPs and catalog roles
        run: >-
          node scripts/classes-family-heavy-task.mjs --
          npm exec -w front-end -- vitest run
          test/pygames-core-import.spec.test.ts
          test/python-ide-game-graphics.spec.test.ts
          test/python-sandbox.spec.test.ts
          test/components.python-runtime.spec.test.ts
          test/python-ide.module.spec.test.ts
          test/pygames-core-catalog.spec.test.ts
          test/pygames-course-workflows.spec.test.ts
          test/store.courses.python-pygames-classroom.spec.test.ts
          test/store.courses.catalog-identities.spec.test.ts
          --no-file-parallelism --maxWorkers=1
      - name: Build the complete site
        run: node scripts/classes-family-heavy-task.mjs -- npm run build
      - name: Verify class loops and execution limits
        run: node scripts/classes-family-heavy-task.mjs -- python3 test/python-runtime-loop-guards.test.py
      - name: Verify actual PyGames core browser workflows
        env:
          PYGAMES_CORE_BROWSER_PROOF_DIR: output/pygames-core-exports
        run: node scripts/classes-family-heavy-task.mjs -- node --test test/pygames-core-browser.test.mjs
      - name: Verify all pinned original PyGames course and runtime profiles
        if: inputs.full_source_runtime
        env:
          PYGAMES_BROWSER_EXPORT_PROOF_DIR: output/pygames-exports
          CLASSES_FAMILY_HEAVY_TIMEOUT_MS: 2100000
        run: node scripts/classes-family-heavy-task.mjs -- node --test test/pygames-course-workflows-browser.test.mjs
      - name: Retain original PyGames course and runtime evidence
        if: always() && inputs.full_source_runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pygames-original-runtime-workflows
          path: output/pygames-exports/
          if-no-files-found: error
          retention-days: 14

      - name: Retain PyGames core browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
