name: Course preflight

run-name: ${{ inputs.course == 'native-release-evidence' && 'Native release file verification' || inputs.course == 'tracker-evidence' && 'Retained Tracker failure evidence' || inputs.course == 'scratch-tasks' && 'Published Scratch project tasks' || inputs.course == 'course-audit' && 'Course audit follow-ups' || inputs.course == 'scratch-readings' && 'Scratch and self-study readings' || inputs.course == 'scratch-originals' && 'Original Scratch imports' || inputs.course == 'bootcamp' && 'Scratch Bootcamp pages' || inputs.course == 'self-study' && 'Self-study course pages' || inputs.course == 'physics-models' && 'Physics model workflows' || inputs.course == 'networking' && 'Swift Networking source evidence' || inputs.course == 'ai-setup' && 'AI setup reading' || 'PyGames core preflight' }}

on:
  workflow_dispatch:
    inputs:
      course:
        description: Course verification to run
        type: choice
        options: [pygames, networking, ai-setup, self-study, physics-models, bootcamp, scratch-originals, scratch-readings, course-audit, scratch-tasks, tracker-evidence, native-release-evidence]
        default: pygames
      browser_run_id:
        description: Networking browser export workflow run
        type: string
      self_study_courses:
        description: Optional comma-separated self-study course IDs; validated by the browser check
        type: string
      browser_artifact_id:
        description: Networking browser export artifact
        type: string

      native_run_id:
        description: Retained native result producer run
        type: string
      native_artifact_id:
        description: Retained native result artifact
        type: string
      native_artifact_sha256:
        description: Independently verified original ZIP SHA256
        type: string

permissions:
  contents: read

concurrency:
  group: pygames-core-preflight-${{ github.ref }}-${{ (inputs.course == 'tracker-evidence' || inputs.course == 'native-release-evidence') && 'evidence' || 'validation' }}
  cancel-in-progress: false

jobs:

  native-release-evidence:
    if: inputs.course == 'native-release-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/verify-native-release-evidence.py
            /test/native-release-evidence-selection.test.py
      - name: Verify native producer selection boundaries
        run: python3 -B test/native-release-evidence-selection.test.py
      - name: Authenticate the native CI producer and annotated tag
        id: producer
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN_ID: ${{ inputs.native_run_id }}
          NATIVE_ARTIFACT_ID: ${{ inputs.native_artifact_id }}
          NATIVE_SHA256: ${{ inputs.native_artifact_sha256 }}
        run: >-
          python3 scripts/verify-native-release-evidence.py
          --run-id "$NATIVE_RUN_ID" --artifact-id "$NATIVE_ARTIFACT_ID"
          --sha256 "$NATIVE_SHA256" --output output/native-release-evidence --describe
      - name: Read the independently trusted release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.producer.outputs.tag }}
          path: .native-trusted
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
            /front-end/package.json
            /back-end/package.json
            /back-end/package-lock.json
            /scripts/verify-native-source.sh
            /scripts/verify-native-release.mjs
            /deploy/native/
      - name: Verify the unchanged archive, every payload file and both signed subjects
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN_ID: ${{ inputs.native_run_id }}
          NATIVE_ARTIFACT_ID: ${{ inputs.native_artifact_id }}
          NATIVE_SHA256: ${{ inputs.native_artifact_sha256 }}
        run: >-
          python3 scripts/verify-native-release-evidence.py
          --run-id "$NATIVE_RUN_ID" --artifact-id "$NATIVE_ARTIFACT_ID"
          --sha256 "$NATIVE_SHA256" --output output/native-release-evidence
          --trusted .native-trusted
      - name: Retain native release verification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-release-independent-evidence
          path: output/native-release-evidence/
          if-no-files-found: error
          retention-days: 14

  tracker-evidence:
    if: inputs.course == 'tracker-evidence'
    runs-on: macos-26
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify bounded retained native result selection
        run: python3 test/native-ui-evidence-selection.test.py
      - name: Inspect the unchanged original native failure
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN_ID: ${{ inputs.native_run_id }}
          NATIVE_ARTIFACT_ID: ${{ inputs.native_artifact_id }}
          NATIVE_SHA256: ${{ inputs.native_artifact_sha256 }}
        run: >-
          python3 scripts/inspect-native-ui-evidence.py
          --run-id "$NATIVE_RUN_ID"
          --artifact-id "$NATIVE_ARTIFACT_ID"
          --sha256 "$NATIVE_SHA256"
          --output output/native-evidence
      - name: Retain original failure analysis
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-tracker-failure-analysis
          path: output/native-evidence/
          if-no-files-found: error
          retention-days: 14

  preflight:
    if: inputs.course == 'pygames'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CLASSES_FAMILY_TASK_ID: pygames-core-preflight-${{ github.run_id }}
      COURSE_CATALOG_PROOF_DIR: ${{ github.workspace }}/output/pygames-core-preflight/catalog
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - name: Pin the supported npm toolchain
        run: npm install --global npm@12.0.1
      - name: Verify root clean install
        run: node scripts/classes-family-heavy-task.mjs -- npm ci
      - name: Lint both workspaces
        run: node scripts/classes-family-heavy-task.mjs -- npm run lint
      - name: Check both workspace types
        run: node scripts/classes-family-heavy-task.mjs -- npm run typecheck
      - name: Verify core imports, saved files, ZIPs and catalog roles
        run: >-
          node scripts/classes-family-heavy-task.mjs --
          npm exec -w front-end -- vitest run
          test/pygames-core-import.spec.test.ts
          test/python-ide-game-graphics.spec.test.ts
          test/python-sandbox.spec.test.ts
          test/components.python-runtime.spec.test.ts
          test/python-ide.module.spec.test.ts
          test/pygames-core-catalog.spec.test.ts
          test/pygames-course-workflows.spec.test.ts
          test/store.courses.python-pygames-classroom.spec.test.ts
          test/store.courses.catalog-identities.spec.test.ts
          --no-file-parallelism --maxWorkers=1
      - name: Build the complete site
        run: node scripts/classes-family-heavy-task.mjs -- npm run build
      - name: Verify class loops and execution limits
        run: node scripts/classes-family-heavy-task.mjs -- python3 test/python-runtime-loop-guards.test.py
      - name: Verify actual PyGames core browser workflows
        env:
          PYGAMES_CORE_BROWSER_PROOF_DIR: output/pygames-core-exports
        run: node scripts/classes-family-heavy-task.mjs -- node --test test/pygames-core-browser.test.mjs
      - name: Retain PyGames core browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pygames-core-browser-workflows
          path: output/pygames-core-exports
          if-no-files-found: error
          retention-days: 14

      - name: Retain complete catalog evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pygames-core-preflight
          path: output/pygames-core-preflight
          if-no-files-found: error
          retention-days: 14

  networking:
    if: inputs.course == 'networking'
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      CLASSES_FAMILY_TASK_ID: swift-networking-evidence-${{ github.run_id }}
      CLASSES_FAMILY_MIN_DISK_GB: 8
      CLASSES_FAMILY_HEAVY_TIMEOUT_MS: 3300000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
      - name: Bind retained browser exports to the unchanged application source
        env:
          BROWSER_RUN_ID: ${{ inputs.browser_run_id }}
          BROWSER_ARTIFACT_ID: ${{ inputs.browser_artifact_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          assert repository in {"anderson-webops/classes.jacobdanderson.net", "instruction-material/classes.jacobdanderson.net"}
          run_id = os.environ["BROWSER_RUN_ID"]
          artifact_id = os.environ["BROWSER_ARTIFACT_ID"]
          assert all(value.isascii() and value.isdecimal() and 0 < int(value) and len(value) < 21 for value in [run_id, artifact_id])

          def api(path):
              request = urllib.request.Request(
                  "https://api.github.com/repos/" + repository + "/" + path,
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"}
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          artifact = api("actions/artifacts/" + artifact_id)
          origin = artifact["workflow_run"]
          run = api("actions/runs/" + run_id)
          jobs = api("actions/runs/" + run_id + "/jobs?per_page=100")["jobs"]
          assert artifact["name"] == "swift-networking-workflows" and not artifact["expired"]
          assert 0 < artifact["size_in_bytes"] < 8 * 1024 * 1024
          assert origin["id"] == run["id"] == int(run_id) and origin["head_sha"] == run["head_sha"]
          assert run["repository"]["full_name"] == repository and run["path"] == ".github/workflows/ci.yml"
          assert run["status"] == "completed" and run["conclusion"] in {"success", "cancelled"}
          assert any(job["name"] == "swift-browser" and job["head_sha"] == run["head_sha"]
                     and job["status"] == "completed" and job["conclusion"] == "success" for job in jobs)

          def root_tree(revision):
              commit = api("git/commits/" + revision)
              return {entry["path"]: entry["sha"] for entry in api("git/trees/" + commit["tree"]["sha"])["tree"]}

          previous = root_tree(origin["head_sha"])
          current = root_tree(os.environ["GITHUB_SHA"])
          unchanged = {name: current[name] for name in ["front-end", "back-end", "package.json", "package-lock.json"]}
          assert all(previous[name] == digest for name, digest in unchanged.items())
          proof = Path(os.environ["RUNNER_TEMP"]) / "swift-networking-ios/browser-origin.json"
          proof.parent.mkdir(parents=True, exist_ok=True)
          proof.write_text(json.dumps({
              "at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "repository": repository, "verificationHead": os.environ["GITHUB_SHA"],
              "artifact": artifact, "browserProducerJobPassed": True,
              "unchangedApplicationInputs": unchanged,
              "scope": "Retained actual browser exports from identical application/dependency inputs; fresh native verification uses this checkout's harness."
          }, indent=2) + "\n")
          PY
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ inputs.browser_artifact_id }}
          run-id: ${{ inputs.browser_run_id }}
          github-token: ${{ github.token }}
          path: output/swift-networking-workflows
          merge-multiple: true
      - name: Wait for the hosted Mac to settle within the native load limit
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path
          import time
          proof = Path(os.environ["RUNNER_TEMP"]) / "swift-networking-ios/runner-readiness.json"
          samples = []
          deadline = time.monotonic() + 600
          while True:
              load = os.getloadavg()[0]
              samples.append({"at": datetime.datetime.now(datetime.timezone.utc).isoformat(), "load": load})
              ready = load <= 8
              proof.write_text(json.dumps({"ready": ready, "maximumLoad": 8, "samples": samples}, indent=2) + "\n")
              if ready:
                  break
              if time.monotonic() >= deadline:
                  raise SystemExit("Hosted Mac did not settle; native checks have not run")
              time.sleep(10)
          PY
      - name: Verify all supplied Networking contracts from actual browser ZIPs
        run: >-
          node scripts/classes-family-heavy-task.mjs --
          python3 test/swift-networking-exported-contracts.py
          --browser output/swift-networking-workflows/swift-networking-browser
          --proof "$RUNNER_TEMP/swift-networking-ios/contracts/proof.json"
      - name: Bind built and installed apps and run both roles on two iPhone sizes
        run: >-
          node scripts/classes-family-heavy-task.mjs --
          python3 test/swift-welcome-exported-ios.py --course networking
          --browser output/swift-networking-workflows/swift-networking-browser
          --proof "$RUNNER_TEMP/swift-networking-ios/proof.json"
      - name: Retain complete Networking source and native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: swift-networking-source-evidence
          path: |
            output/swift-networking-workflows/
            ${{ runner.temp }}/swift-networking-ios/browser-origin.json
            ${{ runner.temp }}/swift-networking-ios/runner-readiness.json
            ${{ runner.temp }}/swift-networking-ios/proof.json
            ${{ runner.temp }}/swift-networking-ios/processes.jsonl
            ${{ runner.temp }}/swift-networking-ios/logs/
            ${{ runner.temp }}/swift-networking-ios/results/
            ${{ runner.temp }}/swift-networking-ios/contracts/proof.json
            ${{ runner.temp }}/swift-networking-ios/contracts/processes.jsonl
            ${{ runner.temp }}/swift-networking-ios/contracts/*.txt
            ${{ runner.temp }}/swift-networking-ios/contracts/**/contracts-proof.json
          if-no-files-found: error
          retention-days: 14

  ai-setup:
    if: inputs.course == 'ai-setup'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLASSES_FAMILY_TASK_ID: ai-setup-reading-${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
      - name: Create an isolated lesson environment
        run: node scripts/classes-family-heavy-task.mjs -- python3 -m venv "$RUNNER_TEMP/ai-setup-environment"
      - name: Install the reading's graph and notebook dependencies
        run: >-
          node scripts/classes-family-heavy-task.mjs --
          "$RUNNER_TEMP/ai-setup-environment/bin/python" -m pip install
          networkx matplotlib jupyterlab
      - name: Execute the exact reading example and verify the result
        run: >-
          node scripts/classes-family-heavy-task.mjs --
          "$RUNNER_TEMP/ai-setup-environment/bin/python" test/ai-search-setup-reading.py
          --proof output/ai-setup-reading/proof.json
      - name: Retain the complete reading execution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ai-setup-reading
          path: output/ai-setup-reading/
          if-no-files-found: error
          retention-days: 14

  self-study:
    if: inputs.course == 'self-study' || inputs.course == 'physics-models' || inputs.course == 'bootcamp' || inputs.course == 'scratch-originals' || inputs.course == 'scratch-readings' || inputs.course == 'course-audit' || inputs.course == 'scratch-tasks'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CLASSES_FAMILY_TASK_ID: self-study-courses-${{ github.run_id }}
      SELF_STUDY_BROWSER_PROOF_DIR: ${{ github.workspace }}/output/self-study-browser
      SELF_STUDY_BROWSER_COURSES: ${{ inputs.course == 'bootcamp' && 'scratch-level-1-bootcamp' || inputs.course == 'physics-models' && 'pre-algebra-a,intro-to-physics,physics-level-2' || inputs.course == 'self-study' && inputs.self_study_courses || '' }}
      PHYSICS2_BROWSER_PROOF_DIR: ${{ github.workspace }}/output/self-study-browser/physics-models
      SCRATCH_ORIGINAL_BROWSER_PROOF_DIR: ${{ github.workspace }}/output/self-study-browser/scratch-originals
      COURSE_CATALOG_PROOF_DIR: ${{ github.workspace }}/output/self-study-browser/catalog
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - name: Pin the supported npm toolchain
        run: |
          npm install --global npm@12.0.1
          test "$(npm --version)" = "12.0.1"
      - name: Verify root clean install
        run: node scripts/classes-family-heavy-task.mjs -- npm ci
      - name: Audit all root dependencies and production dependencies
        run: |
          mkdir -p output/self-study-browser/audits
          npm audit --json --audit-level=info > output/self-study-browser/audits/root-full.json
          npm audit --omit=dev --json --audit-level=info > output/self-study-browser/audits/root-production.json
      - name: Verify standalone backend installation policy
        run: node --test test/standalone-backend-install-policy.test.mjs
      - name: Verify the standalone backend locked installation
        working-directory: back-end
        run: node ../scripts/classes-family-heavy-task.mjs -- npm ci --include=optional --strict-allow-scripts --workspaces=false
      - name: Audit both standalone backend dependency scopes
        working-directory: back-end
        run: |
          npm ls --all --workspaces=false
          npm audit --include=optional --workspaces=false --json --audit-level=info > "$GITHUB_WORKSPACE/output/self-study-browser/audits/backend-full.json"
          npm audit --include=optional --omit=dev --workspaces=false --json --audit-level=info > "$GITHUB_WORKSPACE/output/self-study-browser/audits/backend-production.json"
      - name: Lint and typecheck both workspaces
        run: |
          node scripts/classes-family-heavy-task.mjs -- npm run lint
          node scripts/classes-family-heavy-task.mjs -- npm run typecheck
      - name: Verify all catalog identities and export self-study expectations
        run: >-
          node scripts/classes-family-heavy-task.mjs --
          npm exec -w front-end -- vitest run
          test/store.courses.catalog-identities.spec.test.ts
          test/store.courses.self-study-browser-manifest.spec.test.ts
          test/store.courses.middle-school-integrated-science-flow.spec.test.ts
          test/store.courses.elementary-science-flow.spec.test.ts test/store.courses.intro-biology-flow.spec.test.ts
          test/store.courses.python-level-1-foundations.spec.test.ts
          test/store.courses.pygames-flow.spec.test.ts
          test/store.courses.early-elementary-a-flow.spec.test.ts
          test/store.courses.early-elementary-b-content.spec.test.ts
          test/store.courses.late-elementary-a-content.spec.test.ts
          test/store.courses.late-elementary-b-content.spec.test.ts
          test/store.courses.joy-of-reading-flow.spec.test.ts
          test/store.courses.joy-of-reading-content.spec.test.ts
          test/store.courses.picture-book-content.spec.test.ts
          test/components.courseexplorer-inventory.spec.test.ts
          test/modules.course-lesson-presentation.spec.test.ts
          test/modules.authored-reading.spec.test.ts
          test/courseAssetPreview.spec.test.ts
          test/components.courseexplorer.spec.test.ts
          test/store.courses.student-facing-copy.spec.test.ts
          test/store.courses.grammar-mechanics-content.spec.test.ts
          test/store.courses.grammar-mechanics-flow.spec.test.ts
          test/store.courses.middle-school-literature-content.spec.test.ts
          test/store.courses.middle-school-literature-flow.spec.test.ts
          test/store.courses.middle-school-writing-content.spec.test.ts
          test/store.courses.middle-school-writing-flow.spec.test.ts
          test/store.courses.middle-school-writing-retake-flow.spec.test.ts
          test/store.courses.entrepreneurship-flow.spec.test.ts
          test/store.courses.novel-writing-flow.spec.test.ts
          test/store.courses.novel-writing-content.spec.test.ts
          test/store.courses.public-speaking-flow.spec.test.ts
          test/store.courses.public-speaking-content.spec.test.ts
          test/store.courses.physics-level-2-flow.spec.test.ts
          test/physics-level-2-ide.spec.test.ts
          test/physics-materials-rendering.spec.test.ts
          test/store.courses.pre-algebra-a-flow.spec.test.ts
          test/store.courses.prealgebra-a-practice.spec.test.ts
          test/store.courses.geometry-a-flow.spec.test.ts
          test/store.courses.geometry-practice.spec.test.ts
          test/store.courses.scratch-bootcamp-flow.spec.test.ts
          test/store.courses.scratch-bootcamp-content.spec.test.ts
          test/store.courses.algebra2-self-study.spec.test.ts
          test/store.courses.scratch-level-1-flow.spec.test.ts
          test/store.courses.scratch-juni-instructions.spec.test.ts
          test/modules.scratch-originals.spec.test.ts
          test/components.scratch-original-import.spec.test.ts
          test/scratch.classroom.spec.test.ts
          test/scratch.input.spec.test.ts
          test/production-security-headers.spec.test.ts
          --no-file-parallelism --maxWorkers=1
      - name: Verify complete course quality and implementation artifacts
        run: node scripts/classes-family-heavy-task.mjs -- npm run -w front-end test:course-quality
      - name: Verify Algebra diagram coordinates and operation conditions
        run: |
          node scripts/classes-family-heavy-task.mjs -- node front-end/scripts/generate-algebra2-diagrams.mjs --check
          node scripts/classes-family-heavy-task.mjs -- node --test test/algebra2-diagram-contracts.test.mjs
      - name: Preserve legitimate course references
        run: >-
          node scripts/classes-family-heavy-task.mjs --
          npm exec -w front-end -- vitest run test/components.courseexplorer.spec.test.ts
          -t 'keeps reference appendices separate|offers original Scratch imports|offers each original Bootcamp capstone' --no-file-parallelism --maxWorkers=1
      - name: Build both workspaces
        id: course_build
        run: node scripts/classes-family-heavy-task.mjs -- npm run build
      - name: Verify all self-study course pages in both roles and sizes
        if: inputs.course != 'scratch-originals' && inputs.course != 'scratch-tasks'
        run: |
          node --test test/self-study-browser-batches.test.mjs
          node scripts/classes-family-heavy-task.mjs -- node scripts/verify-self-study-browser-batches.mjs
      - name: Verify the Physics Level 2 Python models against independent values
        id: physics_native
        if: always() && !cancelled() && inputs.course == 'physics-models' && steps.course_build.outcome == 'success'
        run: python3 -I -B test/physics-level-2-code-packs.test.py
      - name: Verify Physics consent, actual Python runs, edits and saved exports
        if: always() && !cancelled() && inputs.course == 'physics-models' && steps.course_build.outcome == 'success' && steps.physics_native.outcome == 'success'
        run: node scripts/classes-family-heavy-task.mjs -- node --test test/physics-level-2-workflows-browser.test.mjs
      - name: Verify original Scratch program and media identities
        if: inputs.course == 'scratch-originals' || inputs.course == 'course-audit'
        run: node scripts/classes-family-heavy-task.mjs -- node --test --test-concurrency=1 test/scratch-projects.test.mjs test/scratch-original-projects.test.mjs
      - name: Verify original imports and classroom workflows in the actual Scratch editor
        if: inputs.course == 'scratch-originals' || inputs.course == 'course-audit'
        run: node scripts/classes-family-heavy-task.mjs -- node --test test/scratch-browser.test.mjs
      - name: Verify Scratch readings and published project tasks in both roles and sizes
        if: inputs.course == 'scratch-readings' || inputs.course == 'scratch-tasks'
        env:
          SCRATCH_BROWSER_READING_ONLY: '1'
        run: node scripts/classes-family-heavy-task.mjs -- node --test test/scratch-browser.test.mjs
      - name: Retain self-study pages, audits and original failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.course == 'scratch-tasks' && 'scratch-published-tasks' || inputs.course == 'course-audit' && 'course-audit-followups' || inputs.course == 'scratch-originals' && 'scratch-original-imports' || inputs.course == 'scratch-readings' && 'scratch-self-study-readings' || 'self-study-course-pages' }}
          path: output/self-study-browser/
          if-no-files-found: error
          retention-days: 14
