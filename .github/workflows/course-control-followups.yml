name: Course control follow-ups

on:
    push:
        branches: [codex/course-control-followups]

permissions:
    contents: read
    actions: read

concurrency:
    group: course-control-followups-${{ github.ref }}
    cancel-in-progress: false

jobs:
    native-controls:
        strategy:
            fail-fast: false
            max-parallel: 1
            matrix:
                course: [map, capstone, tracker]
        runs-on: macos-26
        timeout-minutes: 60
        env:
            SWIFT_COURSE: ${{ matrix.course }}
            CLASSES_FAMILY_TASK_ID: course-control-native-${{ matrix.course }}
            CLASSES_FAMILY_MIN_DISK_GB: 8
            CLASSES_FAMILY_HEAVY_TIMEOUT_MS: 3300000
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: 24.18.0

            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
              if: matrix.course != 'tracker'
              with:
                  artifact-ids: "12563285480"
                  run-id: 40100945487
                  github-token: ${{ github.token }}
                  merge-multiple: true
                  path: output/swift-canonical-workflows

            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
              if: matrix.course == 'tracker'
              with:
                  artifact-ids: "12563400011"
                  run-id: 40100945487
                  github-token: ${{ github.token }}
                  merge-multiple: true
                  path: output/swift-tracker-workflows

            - name: Wait for the hosted Mac to settle
              run: |
                  python3 - <<'PY'
                  import datetime
                  import json
                  import os
                  from pathlib import Path
                  import time

                  proof = Path(os.environ["RUNNER_TEMP"]) / "course-control-native/runner-readiness.json"
                  proof.parent.mkdir(parents=True, exist_ok=True)
                  samples = []
                  deadline = time.monotonic() + 600
                  while True:
                      load = os.getloadavg()[0]
                      samples.append({"at": datetime.datetime.now(datetime.timezone.utc).isoformat(), "load": load})
                      ready = load <= 8
                      proof.write_text(json.dumps({"ready": ready, "maximumLoad": 8, "samples": samples}, indent=2) + "\n")
                      print(f"Hosted Mac load: {load:.2f}; required maximum: 8", flush=True)
                      if ready:
                          break
                      if time.monotonic() >= deadline:
                          raise SystemExit("Hosted Mac did not settle within ten minutes; native checks have not run")
                      time.sleep(10)
                  PY

            - name: Verify actual scroll gesture geometry
              if: matrix.course == 'map'
              run: node scripts/classes-family-heavy-task.mjs -- python3 test/swift-course-scroll-geometry.py

            - name: Verify all selected course roles and text sizes on both iPhone sizes
              if: matrix.course != 'tracker'
              run: node scripts/classes-family-heavy-task.mjs -- python3 test/swift-welcome-exported-ios.py --course "$SWIFT_COURSE" --browser "output/swift-canonical-workflows/swift-${SWIFT_COURSE}-browser" --proof "$RUNNER_TEMP/course-control-native/$SWIFT_COURSE/proof.json"

            - name: Verify all Tracker roles and text sizes on both iPhone sizes
              if: matrix.course == 'tracker'
              run: node scripts/classes-family-heavy-task.mjs -- python3 test/swift-tracker-exported-ios.py --course tracker --browser output/swift-tracker-workflows/swift-tracker-browser --proof "$RUNNER_TEMP/course-control-native/tracker/proof.json"

            - name: Retain original native results
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: ${{ matrix.course == 'tracker' && 'swift-tracker-ui-tracker' || format('swift-canonical-{0}-ios', matrix.course) }}
                  path: |
                      ${{ runner.temp }}/course-control-native/runner-readiness.json
                      ${{ runner.temp }}/course-control-native/**/proof.json
                      ${{ runner.temp }}/course-control-native/**/processes.jsonl
                      ${{ runner.temp }}/course-control-native/**/logs/
                      ${{ runner.temp }}/course-control-native/**/results/
                      ${{ runner.temp }}/course-control-native/**/inputs.json
                  if-no-files-found: error
                  retention-days: 7

    browser-controls:
        runs-on: ubuntu-24.04
        timeout-minutes: 75
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: 24.18.0
                  cache: npm

            - name: Pin npm version
              run: |
                  npm i -g npm@12.0.1
                  test "$(npm --version)" = "12.0.1"

            - name: Install dependencies
              run: npm ci

            - name: Verify source lint
              run: npm run lint

            - name: Build front-end
              id: build
              run: npm run -w front-end build

            - name: Verify full PyGames core workflows
              env:
                  PYGAMES_CORE_BROWSER_PROOF_DIR: output/pygames-core-exports
              run: node --test --test-concurrency=1 test/browser-runtime-diagnostics.test.mjs test/pygames-core-browser.test.mjs

            - name: Retain PyGames core evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: pygames-core-browser-workflows
                  path: output/pygames-core-exports/
                  if-no-files-found: ignore
                  retention-days: 7

            - name: Verify all 200 USACO workflows
              if: ${{ !cancelled() && steps.build.outcome == 'success' }}
              env:
                  COURSE_IMPORT_SCREENSHOT_DIR: output/playwright
              run: |
                  set -o pipefail
                  mkdir -p output/usaco-workflow
                  JAVAC="$JAVA_HOME_21_X64/bin/javac" JAVA="$JAVA_HOME_21_X64/bin/java" node --test test/usaco-course-import-browser.test.mjs | tee output/usaco-workflow/full.log

            - name: Retain complete USACO workflow evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: usaco-workflow-logs
                  path: output/usaco-workflow/full.log
                  if-no-files-found: ignore
                  retention-days: 7

            - name: Retain USACO screenshots
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: usaco-workspace-screenshots
                  path: output/playwright/course-import-usaco-*.png
                  if-no-files-found: ignore
                  retention-days: 7
