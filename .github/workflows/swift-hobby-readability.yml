name: Verify Hobby readability

on:
    pull_request:
        branches: [codex/course-audit-followups]
        paths:
            - ".github/workflows/swift-hobby-readability.yml"
            - "front-end/src/assets/course-guides/swift-hobby.md"
            - "front-end/src/modules/swiftProjectResources.ts"
            - "test/fixtures/swift-hobby-source.json"
            - "test/fixtures/swift-canonical-uitests.swift"
            - "test/swift-hobby-text-recognition.swift"
            - "test/swift-welcome-exported-ios.py"

permissions:
    contents: read

jobs:
    hobby-browser:
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: 24.18.0
                  cache: npm
            - name: Pin npm version
              run: |
                  npm i -g npm@12.0.1
                  test "$(npm --version)" = "12.0.1"
            - name: Install dependencies from the root lockfile
              run: npm ci
            - name: Build the course interface
              run: npm run -w front-end build
            - name: Verify real Hobby imports, saved edits and complete ZIPs
              env:
                  SWIFT_HOBBY_BROWSER_DIR: output/swift-hobby-browser
                  COURSE_IMPORT_SCREENSHOT_DIR: output/swift-hobby-screenshots
              run: node --test --test-name-pattern=hobby test/swift-canonical-course-browser.test.mjs
            - name: Retain original browser exports and screenshots
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: swift-canonical-workflows
                  path: |
                      output/swift-hobby-browser/
                      output/swift-hobby-screenshots/
                  if-no-files-found: error
                  retention-days: 7

    hobby-native:
        needs: hobby-browser
        runs-on: macos-26
        timeout-minutes: 60
        permissions:
            contents: read
            actions: read
        env:
            CLASSES_FAMILY_TASK_ID: hobby-readable-native
            CLASSES_FAMILY_MIN_DISK_GB: 8
            CLASSES_FAMILY_HEAVY_TIMEOUT_MS: 3300000
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: 24.18.0
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
              with:
                  name: swift-canonical-workflows
                  path: output/hobby-browser-exports
            - name: Wait for the hosted Mac within the native load limit
              run: |
                  python3 - <<'PY'
                  import datetime
                  import json
                  import os
                  from pathlib import Path
                  import time

                  proof = Path("output/swift-canonical-ios/runner-readiness.json")
                  proof.parent.mkdir(parents=True, exist_ok=True)
                  samples = []
                  deadline = time.monotonic() + 600
                  while True:
                      load = os.getloadavg()[0]
                      samples.append({"at": datetime.datetime.now(datetime.timezone.utc).isoformat(), "load": load})
                      ready = load <= 8
                      proof.write_text(json.dumps({"ready": ready, "maximumLoad": 8, "samples": samples}, indent=2) + "\n")
                      print(f"Hosted Mac load: {load:.2f}; required maximum: 8", flush=True)
                      if ready:
                          break
                      if time.monotonic() >= deadline:
                          raise SystemExit("Hosted Mac did not settle within ten minutes; native checks have not run")
                      time.sleep(10)
                  PY
            - name: Verify eight original iPhone cases and sixteen rendered text observations
              run: node scripts/classes-family-heavy-task.mjs -- python3 test/swift-welcome-exported-ios.py --course hobby --browser output/hobby-browser-exports/swift-hobby-browser --proof output/swift-canonical-ios/hobby/proof.json
            - name: Retain source-bound native app and text evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: swift-canonical-hobby-ios
                  path: |
                      output/swift-canonical-ios/runner-readiness.json
                      output/swift-canonical-ios/**/proof.json
                      output/swift-canonical-ios/**/processes.jsonl
                      output/swift-canonical-ios/**/logs/
                      output/swift-canonical-ios/**/results/
                      output/swift-canonical-ios/**/inputs.json
                  if-no-files-found: error
                  retention-days: 7

