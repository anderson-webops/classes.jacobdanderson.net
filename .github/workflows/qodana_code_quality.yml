name: Qodana
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write
    env:
      QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
    steps:
      - name: Skip Qodana when QODANA_TOKEN is not configured
        if: env.QODANA_TOKEN == ''
        run: echo "QODANA_TOKEN is not configured; skipping Qodana."

      - uses: actions/checkout@v7
        if: env.QODANA_TOKEN != ''
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Qodana Scan
        if: env.QODANA_TOKEN != ''
        uses: JetBrains/qodana-action@v2026.2
        with:
          args: --linter qodana-js --within-docker false
        env:
          QODANA_TOKEN: ${{ env.QODANA_TOKEN }}
