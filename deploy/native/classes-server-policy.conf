# Include inside the existing classes.jacobdanderson.net HTTPS server block.
server_tokens off;
access_log off;

root /srv/classes.jacobdanderson.net/current/front-end/dist;
index index.html;
error_page 404 =404 /404.html;
client_max_body_size 80m;

location = /api {
	proxy_pass http://127.0.0.1:3008/;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $remote_addr;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_request_buffering off;
	proxy_buffering off;
	access_log off;
}

location ^~ /api/ {
	proxy_pass http://127.0.0.1:3008/;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $remote_addr;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_request_buffering off;
	proxy_buffering off;
	access_log off;
}

location = /index.html {
	include /etc/nginx/snippets/classes-static-headers.conf;
	# Nginx's index module internally resolves / to /index.html. Redirect only
	# when the client actually requested the generated document.
	if ($request_uri ~ ^/index[.]html(?:[?]|$)) {
		return 308 https://classes.jacobdanderson.net/$is_args$args;
	}
	try_files $uri =404;
}

# Keep the unlisted coding-standard route on the classes domain while the
# canonical document remains in the shared static-asset repository.
location = /coding_standard {
	include /etc/nginx/snippets/classes-static-headers.conf;
	return 308 https://static.classes.jacobdanderson.net/coding_standard.md$is_args$args;
}

location = /coding_standard/ {
	include /etc/nginx/snippets/classes-static-headers.conf;
	return 308 https://static.classes.jacobdanderson.net/coding_standard.md$is_args$args;
}

location ~ ^/(?<classes_legacy_route>(?:bluej|graph-sketcher|ide|python-ide|signup|wheel))[.]html$ {
	include /etc/nginx/snippets/classes-static-headers.conf;
	return 308 https://classes.jacobdanderson.net/$classes_legacy_route/$is_args$args;
}

location = /admin/student-management.html {
	include /etc/nginx/snippets/classes-static-headers.conf;
	return 308 https://classes.jacobdanderson.net/admin/student-management/$is_args$args;
}

location ~ ^/.+/index[.]html$ {
	include /etc/nginx/snippets/classes-static-headers.conf;
	if ($request_uri ~ ^(?<classes_direct_index_route>/.+)/index[.]html(?:[?]|$)) {
		return 308 https://classes.jacobdanderson.net$classes_direct_index_route/$is_args$args;
	}
	try_files $uri =404;
}

location = /404.html {
	internal;
	try_files $uri =404;
	include /etc/nginx/snippets/classes-static-headers.conf;
	add_header X-Robots-Tag "noindex, nofollow" always;
}

location / {
	try_files $uri $uri/ =404;
	include /etc/nginx/snippets/classes-static-headers.conf;
}

location ~ (^|/)\. {
	return 404;
}
