# Include once from Nginx's http context.
map $uri $classes_static_csp {
	default "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https://static.classes.jacobdanderson.net https://images.unsplash.com https://jacobdanderson.s3.us-east-1.amazonaws.com; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://api.github.com https://raw.githubusercontent.com; frame-src 'none'; media-src 'self' https://static.classes.jacobdanderson.net; worker-src 'none'; manifest-src 'self'";
	~^/assets/pythonIdePlainWorker-.*[.]js$ "default-src 'none'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; img-src 'none'; font-src 'none'; style-src 'none'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; connect-src 'self' https://cdn.jsdelivr.net https://pypi.org https://files.pythonhosted.org; frame-src 'none'; media-src 'none'; worker-src 'none'; manifest-src 'none'";
	~^/(?:ide|python-ide|bluej)(?:/|[.]html$|$) "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; connect-src 'self' https://api.github.com https://raw.githubusercontent.com https://cdn.jsdelivr.net https://pypi.org https://files.pythonhosted.org; frame-src 'self'; media-src 'self' data: blob:; worker-src 'self'; manifest-src 'self'";
	~^/graph-sketcher(?:/|[.]html$|$) "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-src 'none'; media-src 'self'; worker-src 'self'; manifest-src 'self'";
	~^/signup(?:/|[.]html$|$) "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https://static.classes.jacobdanderson.net https://images.unsplash.com https://jacobdanderson.s3.us-east-1.amazonaws.com; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://api.github.com https://raw.githubusercontent.com https://scheduler.classes.jacobdanderson.net; frame-src https://scheduler.classes.jacobdanderson.net; media-src 'self' https://static.classes.jacobdanderson.net; worker-src 'none'; manifest-src 'self'";
	~^/wheel(?:/|[.]html$|$) "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https://static.classes.jacobdanderson.net https://images.unsplash.com https://jacobdanderson.s3.us-east-1.amazonaws.com; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://api.github.com https://raw.githubusercontent.com; frame-src https://wheeldecide.com; media-src 'self' https://static.classes.jacobdanderson.net; worker-src 'none'; manifest-src 'self'";
	~^/admin/student-management(?:/|[.]html$|$) "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https://static.classes.jacobdanderson.net https://images.unsplash.com https://jacobdanderson.s3.us-east-1.amazonaws.com; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://api.github.com https://raw.githubusercontent.com; frame-src https://docs.google.com; media-src 'self' https://static.classes.jacobdanderson.net; worker-src 'none'; manifest-src 'self'";
}

map $uri $classes_static_cache_control {
	default "no-cache";
	~^/assets/ "public, max-age=31536000, immutable";
	~^/python-ide/assets/ "public, max-age=31536000, immutable";
}
